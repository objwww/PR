# ============================================================================
# 告警 Agent 栈（AM1-T00 清障后基础形态）：postgres + migrate(one-shot) + control-app
#
# AM1 起本仓库是纯告警 Agent 项目（用户 2026-09-04 指示"无用的类就删除，不留技术债"）：
#   - publisher-app / github-stub / sandbox-broker 已整体删除（历史在 git + m4-wip 分支）；
#   - AM3 通知出口届时从 git 历史取 OutboxClaimer/FencedPublicationExecutor 骨架重建；
#   - HolmesGPT 常驻容器与 AM0 告警源网络接入见 T10（alert 网络集成）。
#
# Hardening 落点（沿用 B16 模板，DP 可逐项断言）：
#   - control 以 non-root（uid 10001，镜像内 USER）运行；
#   - 应用容器 read_only rootfs + tmpfs /tmp + cap_drop ALL + no-new-privileges；
#   - 不挂载 docker socket；
#   - control 的 8080 仅绑宿主机 127.0.0.1（Alertmanager 在内网投递，不对公网开放）；
#   - restart: unless-stopped；deploy.resources.limits；json-file 日志轮转。
#
# Flyway 迁移接线——「独立 one-shot 服务 migrate」（V1~V7 迁移历史不可变）：
#   1) 最小权限：owner 凭证只存在于秒级生命周期的 migrate 容器；
#   2) 顺序硬保证：depends_on + service_completed_successfully，迁移失败 = 栈起不来；
#   3) 幂等：flyway migrate 可反复执行。
#
# 已知事实（诚实边界）：
#   - postgres 在 195（内核 3.10）上必须 seccomp:unconfined（INC-09，见 BUGLOG）；
#   - 01-roles.sh 仍创建 publisher_app 角色：V2~V6 历史迁移的授权对象，V7 起显式
#     REVOKE（角色必须存在否则迁移失败）——角色存在 ≠ 服务存在。
#
# 密码/密钥全部走 deploy/.env（.gitignore 已排 .env 与 *.pem），不入库。
# ============================================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # INC-09：195 内核 3.10，postgres:16 镜像的新 syscall 被默认 seccomp 拦，
    # 必须显式放开；此为 postgres 独有例外
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pr_agent}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # initdb 角色脚本读取（deploy/db/01-roles.sh；AM2 增 arena 三角色）
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD:?}
      ARENA_DB_PASSWORD: ${ARENA_DB_PASSWORD:?}
      CHAOS_ADMIN_DB_PASSWORD: ${CHAOS_ADMIN_DB_PASSWORD:?}
      EVAL_DB_PASSWORD: ${EVAL_DB_PASSWORD:?}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB:-pr_agent}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
      # AM2（M2-02）：postgres 加入跨栈共享网，供 arena 域触库——
      #   alert-net：order-arena（arena_app 角色）/ arena-migrate
      #   eval-mgmt：arena-chaos-admin（chaos_admin_app 角色；私网见 deploy/alert compose）
      # C-3 拓扑注：postgres 本就无"管理面"概念，多网成员经角色授权隔离，
      # 不违反"管理服务不得双网"的裁定（该裁定针对的是 0.0.0.0 端口的管理 API）
      - alert-net
      - eval-mgmt
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *logging
    # 不发布端口：验证脚本经 docker compose exec 进容器跑 psql

  migrate:
    # Flyway one-shot（owner 身份执行 V1~V7，完成后退出）
    image: flyway/flyway:10-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pr_agent}
      FLYWAY_USER: postgres # owner 身份（DDL）；该凭证不进入任何业务容器
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # V9（M3-03）：notify_app 角色创建走 Flyway placeholder（AM3 评审纠正：不在 01-roles.sh 提前建）
      FLYWAY_PLACEHOLDERS_NOTIFY_PASSWORD: ${NOTIFY_DB_PASSWORD:?}
    volumes:
      # 直挂 control-app 资源目录（单一事实源）：V1~V7 改动只改一处，杜绝部署副本漂移
      - ../control-app/src/main/resources/db/migration:/flyway/sql:ro
    command: ["-connectRetries=30", "migrate"]
    networks:
      - internal
    logging: *logging

  control-app:
    build:
      # 运行镜像只封装 jar（jar 由宿主机 maven 容器预先 package，见 README），
      # 构建上下文 = 模块目录即可
      context: ../control-app
    image: pr-agent/control-app:0.0.1-SNAPSHOT
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pr_agent}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?}
      SPRING_FLYWAY_ENABLED: "false" # 迁移唯一执行者 = migrate one-shot（文件头注）
      # M3 模型治理（AM4 Java 替换 HolmesGPT 时复用；AM1 期 Holmes 外调不经此路由）
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:?}
      # AM1 告警链路（§6.4/§6.5）：webhook bearer 与 Holmes 独立凭证
      # 键名与 application.yml / AlertSelfCheck 三方统一（BA-09①，G0-02）
      ALERTMANAGER_WEBHOOK_BEARER_TOKEN: ${ALERTMANAGER_WEBHOOK_BEARER_TOKEN:?}
      # AM5 M5-16：控制面防自噬路由独立 bearer（RCA_SYSTEM/monitoring_scope 声明组
      # 经三面门直达值班通道，不建 Incident/Run——INV-AM5-4；:? 必填防静默空值恒拒）
      CONTROL_WEBHOOK_BEARER_TOKEN: ${CONTROL_WEBHOOK_BEARER_TOKEN:?}
      # AM5 M5-09：ConfigBundle 发布/回滚 API 鉴权（release 角色共享凭证，
      # O-4 用户体系落地前形态；:? 必填防静默空值）
      APP_RELEASE_API_BEARER: ${APP_RELEASE_API_BEARER:?}
      # AM5 M5-12：Operator Case API 鉴权（operator 角色共享凭证，同 O-4 形态）
      APP_OPERATOR_API_BEARER: ${APP_OPERATOR_API_BEARER:?}
      # AM7 M7-17：127 duty-adapter 台账回写线（只铸 POST /api/duty/notifications
      # 一面；快照拉取复用上面的 operator 线）。:? 必填——与 127 .env 的
      # DUTY_WRITEBACK_BEARER 同值
      APP_DUTY_ADAPTER_BEARER: ${APP_DUTY_ADAPTER_BEARER:?}
      # EX-C2a：通知出箱渠道名与 notify-app 两侧对齐（test=测试机器人；oncall=固定应急通道）
      APP_ALERT_NOTIFY_CHANNELS: "test,oncall"
      # EX-C3a：浏览器用户会话（单人运维授权形态；:? 必填防静默回退 dev 默认
      # operator/operator——口令原文不落任何配置/日志，只传 bcrypt 哈希）。
      # B-37：.env 值内的 $ 须写作 $$（compose 对 .env 值做插值，裸 $2a$10$…
      # 会被当变量引用吃掉 → 登录恒 401；compose warning "variable is not set" 为直接证据）
      AUTH_OPERATOR_USERNAME: ${AUTH_OPERATOR_USERNAME:?}
      AUTH_OPERATOR_PASSWORD_BCRYPT: ${AUTH_OPERATOR_PASSWORD_BCRYPT:?}
      # AM5 M5-04：采样指纹 provider 身份（部署特定=模型由谁服务，INV-AM5-3 fail-closed：
      # :? 必填——缺省即启动期失败，优于运行期每次调查崩在 requireText）
      APP_ALERT_EVAL_PROVIDER_FINGERPRINT: ${APP_ALERT_EVAL_PROVIDER_FINGERPRINT:?}
      # AM6 M6-01：NATIVE 执行面能力探针（两键空=缺件→nativeReady=false→NATIVE_DEFERRED
      # fail-closed，无默认值 @Value 均带 : 空缺省，不阻断启动；BA-48 同 commit 补映射纪律）
      APP_ALERT_NATIVE_METRICS_EXPR: ${APP_ALERT_NATIVE_METRICS_EXPR:-}
      APP_ALERT_NATIVE_TOOL_REGISTRY_DIGEST: ${APP_ALERT_NATIVE_TOOL_REGISTRY_DIGEST:-}
      # M6-07 Holmes 退场：HOLMES_BASE_URL/HOLMES_API_KEY/APP_ALERT_HOLMES_MODEL、
      # APP_ALERT_FALLBACK_*（M6-04 铸造面已拆）、APP_ALERT_SHADOW_HOLMES_*（M6-05
      # 观察面 bean 已拆）九映射随退场摘除——密钥回收以 .env 摘键 + 全库扫描零命中收口。
      # AM5 M5-15：三支柱遥测出口——control 平面 collector（应用侧零代码变更，
      # exporter 依赖不上类路径时此变量仅作声明面；trace 采样概率同面）
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otelcol-control:4317}
      APP_TRACE_SAMPLING: ${APP_TRACE_SAMPLING:-0.1}
      APP_CAS_DIR: /var/cas
    ports:
      # 默认仅绑 loopback（安全底线）；Alertmanager 在 docker 内网投递，公网零暴露
      - "${CONTROL_BIND:-127.0.0.1}:${CONTROL_PORT:-8080}:8080"
    volumes:
      # CAS：报告 artifact 读写
      - cas-data:/var/cas
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      # G0-10:接告警共享网——alertmanager 经该网投递 webhook(解析服务名
      # control-app)；M6-07 后 holmes 别名已随 holmesgpt 服务摘除
      - alert-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging: *logging

  # EX-C1：alert-web 部署面（nginx 托管 vite dist + /api 反代 control-app；
  # SPA 深链回退与 SSE 透传见 alert-web/nginx.conf）。仅绑 loopback（INV-AM0-1）——
  # 运维经 SSH 隧道访问；与 control-app 同 internal 网（反代解析服务名）。
  # 非特权全周期：nginx 用户（uid 101）+ listen 8080 + 零 capability——
  # root master 的 temp 目录 chown 在 cap_drop ALL 下必败（真机实证），非 root 形态
  # 需要 tmpfs 带 uid/gid（root 属主的 tmpfs 里 uid 101 建不了 client_temp）。
  web:
    build:
      context: ../alert-web
    image: pr-agent/alert-web:0.0.1-SNAPSHOT
    restart: unless-stopped
    user: nginx
    depends_on:
      - control-app
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - internal
    logging: *logging

  # AM3（M3-20~23）通知出口：notify_app 身份（V9 授权面：只碰投递面，不得改报告与
  # 调查记录——BA-10②/E2E-M3-07）；单 worker 领取 notify_outbox → 三档渠道投递。
  notify-app:
    build:
      context: ../notify-app
    image: pr-agent/notify-app:0.0.1-SNAPSHOT
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pr_agent}
      NOTIFY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pr_agent}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?}   # 与 migrate V9 placeholder 同值（INV-AM3-3）
      # 渠道名 test 与 control 侧 app.alert.notify.channels:test 出箱行对齐；
      # webhook=echo-receiver(WireMock)——TEST_CHANNEL 真实到达测试机器人（D01）。
      # EX-C2a：oncall=固定应急通道（LIVE 档值班 webhook，1 个；扩到 2 个=加名+加键）；
      # 真机器人 URL 属运维注入面（.env :? 强制在场），回执语义=机器人接收≠值班员阅读
      NOTIFY_CHANNELS: "test,oncall"
      APP_NOTIFY_CHANNELS_TEST_TIER: "TEST_CHANNEL"
      NOTIFY_CHANNEL_TEST_WEBHOOK: ${NOTIFY_CHANNEL_TEST_WEBHOOK:?}
      NOTIFY_CHANNEL_TEST_SECRET: ${NOTIFY_CHANNEL_TEST_SECRET:-}
      APP_NOTIFY_CHANNELS_ONCALL_TIER: "LIVE"
      NOTIFY_CHANNEL_ONCALL_WEBHOOK: ${NOTIFY_CHANNEL_ONCALL_WEBHOOK:?}
      NOTIFY_CHANNEL_ONCALL_SECRET: ${NOTIFY_CHANNEL_ONCALL_SECRET:-}
      # AM7 M7-13/14：duty 渠道 env 键名制——duty_channel 行只存键名，值在此注入。
      # 演练值：K_DUTY_TEST_WEBHOOK 复用 echo-receiver（L2 SENT 钉）；
      # K_DUTY_DEAD_WEBHOOK 指向必拒地址（降级演练：P1 持续失败→DEAD→watcher 补投 P2）
      K_DUTY_TEST_WEBHOOK: ${NOTIFY_CHANNEL_TEST_WEBHOOK:?}
      K_DUTY_DEAD_WEBHOOK: ${DUTY_K_DEAD_WEBHOOK:-http://127.0.0.1:9/dead}
      # M7-17：duty-adapter 台账回写线 bearer 只进 control-app；notify-app 不需要
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      # 仅接 echo-receiver 所在网（测试机器人出口）；不接业务网/eval-mgmt（隔离面）
      - alert-ab
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    logging: *logging

  # AM5 M5-15 三支柱完整化：control 平面遥测 collector（metrics/trace/log 出口收敛）。
  # 独立出口/独立凭据（OTEL_UPSTREAM_* 走 .env :? 必填，与 webhook/DB/模型凭据全独立）；
  # 资源上限双面：容器 384M + 进程内 memory_limiter 256M；INV-AM5-8：本服务与业务
  # 零双向依赖（control-app 不 depends_on、collector 挂只丢遥测），切断出口不改业务状态。
  otelcol-control:
    image: otel/opentelemetry-collector-contrib:0.104.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otelcol-config.yml"]
    volumes:
      - ./otelcol-control/otelcol-config.yml:/etc/otelcol/otelcol-config.yml:ro
      # B-35：EX-B2 曾计划挂 docker.sock 供 docker_logs receiver——该 receiver 在
      # otelcol-contrib 全版本不存在（components 实测），socket 挂载随之摘除
    environment:
      OTEL_UPSTREAM_ENDPOINT: ${OTEL_UPSTREAM_ENDPOINT:?}
      OTEL_UPSTREAM_TOKEN: ${OTEL_UPSTREAM_TOKEN:?}
      OTEL_UPSTREAM_INSECURE: ${OTEL_UPSTREAM_INSECURE:-true}
    ports:
      # 仅绑 loopback（INV-AM0-1）：OTLP 入口只服务 compose 内网（不发布），
      # 本地拉面/健康面给宿主运维
      - "127.0.0.1:9465:9465"
      - "127.0.0.1:13133:13133"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      # 部署段适配：导出上游 = demo 栈 collector（opentelemetry-demo 外部网，
      # 195 实布面）；C-20 隔离的是配置面非网络面——上游不可达只丢遥测不改业务
      # （INV-AM5-8，E2E-AM5-08 切断场景即断此网向）
      - otel-demo-upstream
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    logging: *logging

  # EX-B2：logs 真实源试验资源（docs/告警-EXB2-logs真实源.md §3——试验上限与准入条件
  # 而非容量承诺）：mem_limit 384m ≤ 512MiB 准入线；retention 72h；OTLP 入口
  # /otlp/v1/logs 双路接入（B-35 裁定）：otelcol-control（control 平面 OTLP logs）
  # + demo collector otlphttp/loki（业务服务自带 OTLP logs）。
  # 查询面 3100 仅 internal 网（control-app LogQueryExecutor）；零宿主端口 INV-AM0-1。
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      # EX-B2/B-35：demo collector（otelcol-config-extras.yml otlphttp/loki）经 demo
      # 外部网推送业务服务 OTLP logs；loki 仍零宿主端口（INV-AM0-1）
      - otel-demo-upstream
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    logging: *logging

volumes:
  pg-data:
  cas-data:
  loki-data:

networks:
  internal:
    driver: bridge
  alert-net:
    external: true   # 与 deploy/alert 共享(预先 docker network create alert-net)
  eval-mgmt:
    external: true   # AM2 chaos 管理面私网(deploy/alert 侧孤立；预先 create --internal)
  alert-ab:
    external: true   # echo-receiver(测试机器人)所在网（G0 起）；预先 create
  otel-demo-upstream:
    external: true
    name: opentelemetry-demo   # demo 栈 collector 网（195 实布；otelcol-control 导出上游）
