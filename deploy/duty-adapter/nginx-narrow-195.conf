# AM7 M7-17：195 宿主 nginx 窄反代（只服务 WG 隧道对端 127 duty-adapter）
#
# 安装面（M7-18 部署段执行）：
#   - 195 宿主无 nginx 时先 yum/dnf install nginx（本文件只挂 server 块，
#     include 进 /etc/nginx/conf.d/；SELinux 放行 nginx 反代 loopback:
#     setsebool -P httpd_can_network_connect 1——按现场实际核定）
#   - control-app 只绑 127.0.0.1:8080（deploy/docker-compose.yml 默认），本反代是
#     它在隧道地址上的唯一出口
#
# 暴露面纪律（AM7 §7：窄反代而非 control-app 增绑隧道地址）：
#   - 只放行 GET/POST 两条 duty 路径；其余一律 404（负向验收：经隧道打
#     /api/rca-runs 必须不可达——E2E 演练项）
#   - EX-C4（MIG-02）：Gatus 黑盒探针三条**精确 GET** 健康路径（只读、无凭据面）
#     ——195 三目标均 loopback 绑定（MIG-01 负向验收实证），隧道唯一出口即本反代
#   - listen 只挂 10.250.250.1（WG 接口）——公网/内网其他面零监听

server {
    listen 10.250.250.1:8090;
    server_name _;

    # 127 adapter 60s 快照拉取（operator 机器线 bearer 由 adapter 自带）
    location = /api/duty/schedule/snapshot {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 127 adapter 台账回写（duty-adapter 机器线；方法面与 SecurityConfig 匹配器一致）
    location = /api/duty/notifications {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # EX-C4：Gatus 探 control 健康黑盒（GET only；actuator health 非鉴权面）
    location = /probe/control-health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # EX-C4：Gatus 探 alertmanager 就绪（/-/ready 原样改写）
    location = /probe/am-ready {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9093/-/ready;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # EX-C4：Gatus 探 arena 前端黑盒（容器 healthcheck 同款 /healthz；根路径 404）
    location = /probe/arena {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8082/healthz;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
