# AM0 独立 Prometheus（告警AM0-部署验证设计.md §6 S5）
# 抓取面：otel-collector（demo core 全指标）+ order-arena（靶场）+ node-exporter-host1
#（宿主容量）+ alertmanager（AM 自身）+ control-app actuator（run 吞吐计数器）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']
    metric_relabel_configs:
      # EN-01/MC34 真窗修复（2026-09-12）：collector prometheus exporter 以
      # service_name 透出 service.name 资源属性，工具面（allowlist 选择器/告警
      # 材料/模型查询）契约按 service 标签——映射恢复标签兼容，双标签共存加法不改旧
      - source_labels: [service_name]
        target_label: service
        regex: '(.+)'
        replacement: '$1'
        action: replace
  # AM2 靶场（order-arena 内嵌 /metrics；指标自带 service="order-arena" 公共标签）
  - job_name: order-arena
    static_configs:
      - targets: ['order-arena:8080']
  # BA-54 memory-gate 补采（2026-09-14）：规则引用 job="node-exporter-host1"，
  # 此前该 job 不存在导致三档内存闸假就绪（序列为零恒 inactive）。
  # 注意：node-exporter 容器名在 prometheus 所在网络的 Docker DNS 不解析（实测 lookup 失败），
  # 改走宿主机隧道地址 10.250.250.1:9100（容器内 wget 实测可达）。
  - job_name: node-exporter-host1
    static_configs:
      - targets: ['10.250.250.1:9100']
  # 127 评测机（MIG-127，2026-09-21）：eval-worker 执行面所在宿主，经 WG 隧道面采集
  - job_name: node-exporter-host2
    static_configs:
      - targets: ['10.250.250.2:9100']
  # 监控页白名单补采（2026-09-14）：alert_receive_rate 的真实源 = AM 自身指标
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager-am0:9093']
  # 监控页白名单补采（2026-09-14）：run_throughput 的真实源 = control-app actuator
  # prometheus 端点（rca_attempt_finished_total；应用侧配套：micrometer-registry-prometheus
  # + exposure 开 prometheus + /actuator/prometheus permitAll，端口宿主侧 127.0.0.1 绑定）
  - job_name: control-app
    static_configs:
      - targets: ['deploy-control-app-1:8080']
    metrics_path: /actuator/prometheus
  # BA-193 flagd 活性补采（2026-09-20）：job 落地后 up{job="flagd"} 即供
  # FlagdDown/FlagdEvaluationStall 规则，process_resident_memory_bytes 供
  # FlagdMemoryNearLimit（无需 cAdvisor，195 实测无该容器）。端口 8014 经
  # 2026-09-20 195 健康窗实测：首字节 0.09s，序列含
  # feature_flag_flagd_impression_total / process_resident_memory_bytes。
  # 注意：flagd 容器在 otel-demo 栈网络，需确认 prometheus-am0 与其网络互通
  # （BA-189 otel-collector 同栈已通，同律）。
  - job_name: flagd
    static_configs:
      - targets: ['flagd:8014']

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager-am0:9093']
