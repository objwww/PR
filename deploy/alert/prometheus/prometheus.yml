# AM0 独立 Prometheus（告警AM0-部署验证设计.md §6 S5）
# 只抓 otel-collector 的 prometheus exporter（demo core 全部指标经 collector 汇出）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager-am0:9093']
