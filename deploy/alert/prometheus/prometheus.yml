# AM0 独立 Prometheus（告警AM0-部署验证设计.md §6 S5）
# 只抓 otel-collector 的 prometheus exporter（demo core 全部指标经 collector 汇出）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']
    metric_relabel_configs:
      # EN-01/MC34 真窗修复（2026-09-12）：collector prometheus exporter 以
      # service_name 透出 service.name 资源属性，工具面（allowlist 选择器/告警
      # 材料/模型查询）契约按 service 标签——映射恢复标签兼容，双标签共存加法不改旧
      - source_labels: [service_name]
        target_label: service
        regex: '(.+)'
        replacement: '$1'
        action: replace
  # AM2 靶场（order-arena 内嵌 /metrics；指标自带 service="order-arena" 公共标签）
  - job_name: order-arena
    static_configs:
      - targets: ['order-arena:8080']
  # BA-54 memory-gate 补采（2026-09-14）：规则引用 job="node-exporter-host1"，
  # 此前该 job 不存在导致三档内存闸假就绪（序列为零恒 inactive）。
  # 注意：node-exporter 容器名在 prometheus 所在网络的 Docker DNS 不解析（实测 lookup 失败），
  # 改走宿主机隧道地址 10.250.250.1:9100（容器内 wget 实测可达）。
  - job_name: node-exporter-host1
    static_configs:
      - targets: ['10.250.250.1:9100']

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager-am0:9093']
