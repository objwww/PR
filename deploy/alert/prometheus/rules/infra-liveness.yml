# BA-189 采集器与管道活性告警（2026-09-20 立案：S27 演练夜 otel-collector 内存超限僵死，
# up=0 症状断流 20 分钟无人知，靠演练失败才暴露——采集面自身必须纳入告警环）。
# 只引用已实测存在的序列（2026-09-20 01:xxZ label/__name__ 直查）：
#   - up{job="otel-collector"}（scrape 健康位）
#   - otelcol_receiver_accepted_spans_total / otelcol_receiver_accepted_metric_points_total
#   - otelcol_receiver_refused_spans_total / otelcol_receiver_refused_metric_points_total
#   - otelcol_process_memory_rss_bytes（当前 186MB，容器限额 400MiB=docker inspect 实测）
# 宿主内存三档闸已由 memory-gate.yml 覆盖（1.2GiB/768MiB/512MiB），本文件不重复。
groups:
  - name: infra-liveness
    rules:
      # 采集器 DOWN（page）：scrape 连续失败 1m——僵死/OOM/崩溃形态，demo 全指标断流
      - alert: OtelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels:
          severity: page
          owner: am0
          category: availability
        annotations:
          summary: "otel-collector 采集器失联（page）"
          description: "prometheus 对 otel-collector:9464 抓取连续失败 1m。otel-demo 全系指标断流，SLO 烧损等下游告警将失真（不 firing≠健康）。立即检查容器状态（docker ps/restart），历史上限 400MiB OOM 僵死有前科。"

      # 管道断流（ticket）：采集器活着但 5m 速率归零持续 10m——僵死但进程未死形态
      # load-generator 24/7 有真实流量，spans/metric_points 速率恒正；归零即管道卡住。
      # 与 OtelCollectorDown 互斥（and up==1），避免双报。
      - alert: OtelCollectorPipelineStall
        expr: >-
          (
            sum(rate(otelcol_receiver_accepted_spans_total[5m]))
            +
            sum(rate(otelcol_receiver_accepted_metric_points_total[5m]))
          ) == 0
          and on() up{job="otel-collector"} == 1
        for: 10m
        labels:
          severity: ticket
          owner: am0
          category: availability
        annotations:
          summary: "otel-collector 管道断流（ticket）"
          description: "采集器 scrape 正常但 spans+metric_points 接收速率 5m 归零且持续 10m——进程活着但管道不进数据（僵死形态）。load-generator 全天候有真实流量，速率归零不可能是业务静默。"

      # 采集器内存逼近容器限额（warning）：RSS 超限额 85% 持续 5m——OOM 僵死前兆
      # 限额 400MiB 来源=195 docker inspect otel-collector HostConfig.Memory=419430400（2026-09-20 实测）；
      # compose 改限额时必须同步本阈值（419430400*0.85≈340MiB）。
      - alert: OtelCollectorMemoryNearLimit
        expr: otelcol_process_memory_rss_bytes > 340*1024*1024
        for: 5m
        labels:
          severity: warning
          owner: am0
          category: capacity
        annotations:
          summary: "otel-collector 内存逼近容器限额（warning）"
          description: "collector RSS={{ $value | humanize1024 }}B，超容器限额 400MiB 的 85% 且持续 5m。OOM 僵死前兆——应排查内存limiter配置或重启采集器，并复核宿主内存水位（memory-gate 三档闸）。"

      # 采集器开始拒数据（warning）：memory_limiter 拒绝 spans/metric_points 持续 10m
      # 拒数据=管道已在丢观测数据但尚未僵死，是 Down/Stall 的更早信号。
      - alert: OtelCollectorRefusingData
        expr: >-
          (
            sum(rate(otelcol_receiver_refused_spans_total[5m]))
            +
            sum(rate(otelcol_receiver_refused_metric_points_total[5m]))
          ) > 0
        for: 10m
        labels:
          severity: warning
          owner: am0
          category: capacity
        annotations:
          summary: "otel-collector 内存限流开始拒数据（warning）"
          description: "memory_limiter 近 5m 持续拒绝 spans/metric_points 且持续 10m——观测数据正在丢失。当前 RSS 接近软限，需降载或扩限，否则下一步即 OtelCollectorMemoryNearLimit→Down。"
