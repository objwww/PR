# BA-193 flagd-liveness.yml 的 promtool 规则测试（离线触发路径证据，不扰动生产）
# 用法：promtool test rules flagd-liveness-test.yml（同目录引用被测文件）
# 序列形态设计说明（2026-09-20 195 实测定稿）：
#   - up{job="flagd", instance="flagd:8014"}：端口 8014 实测可用（健康 0.09s 首字节）。
#   - 内存用 flagd 自身 /metrics 的 process_resident_memory_bytes（无 cAdvisor，实测
#     195 无 cadvisor 容器、宿主 8080 无 cAdvisor），序列带 job/instance 标签。
#   - 求值指标实名 feature_flag_flagd_impression_total（官方旧名
#     flagd_evalution_reason_total 在本版本 /metrics 全量中不存在）。
rule_files:
  - rules/flagd-liveness.yml

evaluation_interval: 15s

tests:
  # 1) flagd DOWN：up=0 持续超 1m → page firing
  - interval: 15s
    input_series:
      - series: 'up{job="flagd", instance="flagd:8014"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: FlagdDown
        exp_alerts:
          - exp_labels:
              severity: page
              owner: am0
              category: availability
              job: flagd
              instance: flagd:8014
            exp_annotations:
              summary: "flagd 旗标服务失联（page）"
              description: "prometheus 对 flagd metrics 口抓取连续失败 1m。2026-09-19 实证形态：内存顶限后进程在但 gRPC 不服务，payment 扣款卡在旗标求值→checkout 100% 失败。立即 docker restart flagd（上次 restart 后 8/8 单 2 秒全过），并复核容器内存限额水位。"

  # 2) 内存逼近限额：RSS=70MiB（>63.75MiB 阈值）持续超 5m → warning firing
  - interval: 15s
    input_series:
      - series: 'process_resident_memory_bytes{job="flagd", instance="flagd:8014"}'
        values: '73400320x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: FlagdMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: am0
              category: capacity
              job: flagd
              instance: flagd:8014
            exp_annotations:
              summary: "flagd 内存逼近容器限额（warning）"
              description: "flagd RSS=70MiB，超容器限额 75MiB 的 85% 且持续 5m。2026-09-19 实证：顶到 88% 后进程僵死、gRPC 断供；2026-09-20 实证 RSS 96% 时 /metrics 响应劣化 200 倍。应在 Down 前介入——预防性 docker restart flagd（重启后 8/8 单 2 秒全过），并复核 compose 内存限额。"

  # 3) 求值断流：flagd up=1 但求值计数器完全平坦（rate=0）持续超 10m → ticket firing
  - interval: 15s
    input_series:
      - series: 'up{job="flagd", instance="flagd:8014"}'
        values: '1x60'
      - series: 'feature_flag_flagd_impression_total{feature_flag_key="cartFailure"}'
        values: '5000x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: FlagdEvaluationStall
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: am0
              category: availability
            exp_annotations:
              summary: "flagd 旗标求值断流（ticket）"
              description: "flagd scrape 正常但求值计数速率 5m 归零且持续 10m——进程活着但旗标不求值（僵死形态）。load-generator 全天候有真实流量，速率归零不可能是业务静默。指标名已经 195 /metrics 实测定稿（feature_flag_flagd_impression_total）。"

  # 4) 短闪断不 page：up=0 仅 45s（未达 for: 1m）即恢复 → Down 不触发
  - interval: 15s
    input_series:
      - series: 'up{job="flagd", instance="flagd:8014"}'
        values: '0x2 1x57'
    alert_rule_test:
      - eval_time: 5m
        alertname: FlagdDown
        exp_alerts: []

  # 5) 反向用例：健康流量（up=1、求值速率恒正、RSS=60MiB 正常）→ 三告警全不触发
  - interval: 15s
    input_series:
      - series: 'up{job="flagd", instance="flagd:8014"}'
        values: '1x60'
      - series: 'process_resident_memory_bytes{job="flagd", instance="flagd:8014"}'
        values: '62914560x60'
      - series: 'feature_flag_flagd_impression_total{feature_flag_key="cartFailure"}'
        values: '5000+100x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: FlagdDown
        exp_alerts: []
      - eval_time: 12m
        alertname: FlagdMemoryNearLimit
        exp_alerts: []
      - eval_time: 12m
        alertname: FlagdEvaluationStall
        exp_alerts: []
