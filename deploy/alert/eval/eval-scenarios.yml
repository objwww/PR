  - scenario_id: S17
    difficulty: L2                        # P6-G8（与 S5 鉴别对-有痕超时 vs 沉默悬挂）
    panel: false
    name: F10 支付悬挂（下单后支付未发起）
    fault_source: AM2 靶场
    scenario_type: 业务交易链路-支付悬挂
    driver: ArenaChaosScenarioDriver
    chaos_family: F10
    target: order-arena chaos- 前缀评测流量的支付发起路径
    partition: VALIDATION                   # [文档已定] §6.2；与 S5 构成鉴别对（有痕超时 vs 沉默悬挂）
    complexity: 单根因
    injection:
      mechanism: 同 S3（chaos on；FaultType=F10_PAYMENT_SILENT）
      effect: >-
        支付授权 INITIATED 出生后故障点沉默——不发起网关请求也不报错，订单停"待支付"积压
        （设计 §3.1 S17 机理）
      selector_semantics: 仅 chaos- 前缀命中，live 流量零污染
      ttl: 同 S3
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: business.payment_pending
      reason_code: F10_PAYMENT_SILENT
    expected_symptom_codes:
      - ArenaPendingPaymentBacklog
    expected_alerts:
      - alertname: ArenaPendingPaymentBacklog
        severity: ticket
        basis: oa_pending_payment_orders_current > 20 持续 5m（ticket 档先 firing）
        labels_frozen: {alertname: ArenaPendingPaymentBacklog, service: order-arena, fault_type: F10, severity: ticket}
      - alertname: ArenaPendingPaymentBacklog
        severity: page
        basis: 持续 15m 升 page（双档规则，page 档可能同批 firing）
        labels_frozen: {alertname: ArenaPendingPaymentBacklog, service: order-arena, fault_type: F10, severity: page}
    expected_evidence_checkpoints:
      - 识别积压订单的年龄段分布（超龄 INITIATED 授权记录）
      - 排除用户行为解释（对比历史同时段基线）
      - 定位支付发起环节缺失而非支付网关本身（S5 鉴别：无技术超时痕迹）
    expected_behavior_note: >-
      与 S5（F3 超时悬挂）构成鉴别对——S5 有 UNKNOWN 对账痕迹，S17 是沉默悬挂；
      应引用 oa_pending_payment_orders_current 与授权记录查询证据
    recovery:
      criteria:
        - chaos off → 恢复面 F10 → 注入关闭即恢复（新订单支付正常发起）
        - oa_pending_payment_orders_current 回落至阈值（20）下
        - 无残留 firing
      restore_probe: oa_pending_payment_orders_current 回落阈值下
      note: 存量 INITIATED 挂单收敛路径（对账/补偿面）在 T8 演练实测校准；若不收敛属恢复面
            缺口，回填 ChaosRecoveryService（挂单 UNKNOWN 化）后递增 registry_version
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 900          # gauge 需积压 >20 + for 5m
      max_resolved_wait_seconds: 900
      cleanup_timeout_seconds: 120

