    expected_alerts:
      - alertname: ArenaOversell
        severity: page
        basis: oa_inventory_negative > 0（同订单多笔 INVENTORY DEDUCT）
        labels_frozen: {alertname: ArenaOversell, service: order-arena, fault_type: F13}
    expected_evidence_checkpoints:
      - 确认超卖事实（负库存/超额扣减记录）
      - 识别竞态条件模式（与流量时间线对齐）
      - 区分"超卖"与"库存数据错误"
