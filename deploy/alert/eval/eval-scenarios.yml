      selector_semantics: 仅 chaos- 前缀命中，live 流量零污染
      ttl: 同 S3
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: business.duplicate_charge
      reason_code: F11_DOUBLE_CHARGE
    expected_symptom_codes:
      - ArenaDuplicatePayments
    expected_alerts:
      - alertname: ArenaDuplicatePayments
        severity: page
        basis: oa_duplicate_payments_current > 0（同订单多笔 CAPTURE 成功）
        labels_frozen: {alertname: ArenaDuplicatePayments, service: order-arena, fault_type: F11}
    expected_evidence_checkpoints:
      - 与 S3 重复订单鉴别（S3 订单层幂等失效 vs S18 支付层幂等失效——跨层）
      - 给出受影响订单规模
      - 止损建议（冻结重试通道）
    expected_behavior_note: >-
      应引用支付记录（同单多笔成功 CAPTURE）与 oa_duplicate_payments_current；
      结论必须落在"支付层"而非"订单层"幂等，否则按 S3 误答（鉴别对面）
