    expected_behavior_note: >-
      应引用 oa_recon_diff_current 与差异明细端点；HOLDOUT H7 同告警不同根因
      （金额差→F18_PRICE_CALC），本场景必须答数量差方向
    recovery:
      criteria:
        - chaos off → 恢复面 F12 → 注入关闭即恢复（扣减行重新齐全）
        - oa_recon_diff_current == 0（对账作业复扫归零）
        - 无残留 firing
      restore_probe: oa_recon_diff_current 归零
      note: 存量差异订单的补记账路径在 T8 演练实测校准
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 300
      max_resolved_wait_seconds: 600
      cleanup_timeout_seconds: 120

