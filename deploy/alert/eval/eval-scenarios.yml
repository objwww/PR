# =====================================================================================
# 批量评测场景清单 v1（并行备料任务 P5 —— AM3 评测输入备料）
# =====================================================================================
# 用途：AM3 首批 5×2 批量评测（M3-17）的场景注册表——"枚举写死"（AM3 v3.0 §6.7）：
#       每场景给出注入参数 / 期望症状 / 期望根因 / 复原判据 / 评测时间参数的预登记面。
# 字段对齐：expected_root_cause / expected_symptom_codes / scenario_id / fault_type / target
#       与 AM2 M2-24 ScenarioMapExportV1 同名同义（对齐关系见文末 scenario_map_export_mapping）。
# 期望根因取值域 = 同目录 synonym-lexicon-v1.yml 的枚举（评分侧唯一匹配依据）。
# 期望症状编码规则：symptom code = 期望 firing 的 Prometheus 规则 alertname（取值面 =
#       deploy/alert/prometheus/rules/*.yml 落码规则），使 claims[].symptom_codes 可确定性对照。
# 纪律：本文件只增不改；场景迭代 = 递增 registry_version + 更新 lexicon 版本绑定。
# 提案分级标注：[文档已定] = 技术方案/落码方案明示；[P5 提案] = 本文件新定，待主会话确认。
# =====================================================================================

# 版本史：v1 = P5 初版；v2（2026-09-09）= S1/S2 max_resolved_wait_seconds 600→2100——
#   full-0910 批（run=fd72d103-10a4-4989-9c81-3fe88e965aa3）实测 checkout page 规则为
#   双分支（5m+1h 档 与 30m+6h 档），复位后 30m 窗稀释需 ~30min，600s 预算必超时
#   （S1R1 恢复判败 alerts_still_firing → 门关闭 → 9 Case gate_blocked，批 14 分钟空转）；
#   证据 docs/测试证据/eval/full-0910/。S3~S5 不动：靶场 Gauge 面秒级 resolved
#   （S3 烟测两轮实测 off→resolved ≤30s），600s 留 20x 余量。
# v3（2026-09-18）= M-a 业务扩编：追加 I 类业务交易链路 S16~S25（v2 设计 §3.1，chaos_family
#   F9~F17）+ 词库扩容绑定 lexicon_version 2（business.* 语义枚举 10 值 + reason_code 10 值）；
#   执行契约 order 扩至 15 场景。HOLDOUT H7/H8 只留设计不注册（§3.5，M-e 批次处理）。
#   S23 复合低剂量标注"部分验证"：M-a 只交付规则面+注册，复合激活（C3）与评分器部分分（E3）
#   依赖 M-b；S16/S18/S20/S23=TUNING，S17/S19/S21/S22/S24/S25=VALIDATION（§6.2）。
#   v3 校准（T7 真机 2026-09-18）：场景注记中指标名统一到 Prometheus 渲染真名——
#   counter oa_orders_created_total 实渲染 oa_orders_total（OpenMetrics 保留字 _created 被剥）、
#   gauge oa_inventory_negative_total 实渲染 oa_inventory_negative；alertname/标签/GT 不变。
# v4（2026-09-17）= P6-G8 难度分层：全 15 场景加 difficulty（L1=靶场单故障单症状直因
#   S3/S4/S5；L2=单根因需定位/长窗判读 S1/S2/S16~S22/S24/S25；L4=复合低剂量级联 S23）
#   + panel SMOKE 快刷子集（S3/S4/S5 三件套——秒级 resolved 最短路径）。装载器
#   GoldenScenarioRegistry 解析两键（非法 difficulty 装载即拒）；LAUNCH 计划 panel=SMOKE
#   只执行 panel:true 子集（forPanel 过滤，registryDigest 承自过滤后子集）。
registry_version: 4
schema_version: 1
status: DRAFT_PENDING_FIRST_BATCH_REVIEW
lexicon_binding: "synonym-lexicon-v1.yml (lexicon_version: 2)"

authority_refs:
  - docs/告警AM3-技术方案.md §6.4（三指标冻结公式）/ §6.7（五场景枚举写死）
  - docs/告警AM2-落码技术方案.md M2-24（ScenarioMapExportV1 交接契约）/ C-4（恢复算法）/ C-6（归属算法）
  - docs/告警AM3-落码技术方案.md M3-17（统一 ScenarioDriver + 评测时间参数显式化 + 上轮 resolved 未归并禁入下轮）
  - deploy/alert/prometheus/rules/arena.yml（AM2 症状规则落码面：告警名/标签/指标名）
  - deploy/alert/prometheus/rules/prometheus-rules-checkout.yml（AM0 Sloth 烧损率规则落码面）
  - research/alert-agent-eval-20260917/故障场景扩展详细设计.md（v3 扩编权威：§1.2 七要素 /
      §3.1 S16~S25 详设 / §6.2 分区归属）
  - deploy/alert/prometheus/rules/arena-business.yml（v3 业务症状规则落码面：alertname/
      severity/fault_type 标签冻结来源）

# -------------------------------------------------------------------------------------
# 执行契约（全场景共有，冻结面）
# -------------------------------------------------------------------------------------
execution_contract:
  # v3 扩编：S16~S25 追加入串行序（T8/T9 演练顺序=S16→S25；S23 复合激活前不参与跑批，
  # 标注部分验证）；AM0 长窗场景（S1/S2）评测编排排最后的既定原则在批内排序时仍适用
  order: [S1, S2, S3, S4, S5, S16, S17, S18, S19, S20, S21, S22, S23, S24, S25]
  scenario_concurrency: 1            # eval 场景并发=1（§6.8）；全局 Live E2E slot=1（AM2 C-6）
  rounds_per_scenario: 2             # 每场景 2 轮取稳定性（§6.7）；每轮独立 scenario_id/eval_case_result（E2E-M3-02）
  next_round_gate: >-                # M3-17 冻结：上轮复原确认 + resolved 归并前禁止进入下一轮/下一场景
    上一轮 recovery.criteria 全部满足 且 告警 resolved 无残留 firing
  on_failure: 失败不中断且落档，任何失败都执行 finally 清理（M3-17）
  traffic_isolation: 评测流量全 chaos- 前缀，不污染正常告警链（INV-AM2-1 / INV-AM3-4）

# -------------------------------------------------------------------------------------
# 场景注册表（首批 5 个，枚举写死）
# -------------------------------------------------------------------------------------
scenarios:

  # ---------------------------------------------------------------------------------
  - scenario_id: S1                        # [文档已定] §6.7 场景编号
    difficulty: L2                        # P6-G8（单故障-双档规则长窗，需恢复窗判读）
    panel: false                          # P6-G8 SMOKE panel 归属（长窗场景不入快刷子集）
    name: paymentFailure=50%
    fault_source: AM0 flagd                # [文档已定] §6.7 故障源
    scenario_type: 业务链路错误率           # [文档已定] §6.7 类型列
    driver: FlagdScenarioDriver            # [文档已定] M3-17 统一 ScenarioDriver 三实现
    chaos_family: null                     # AM0 场景无靶场故障族
    target: payment                        # 根因组件（同 lexicon components.payment）
    injection:
      mechanism: >-
        flagd feature flag 的 defaultVariant 切换（AM0 调研 v1：改 demo.flagd.json 后重启 flagd，
        或 flagd configurator UI）；具体执行由 M3-17 FlagdScenarioDriver 落实
      flag: paymentFailure
      variant: "50%"                        # = 50% 失败比例（§6.7 S1 参数）
      variant_space: ["off", "10%", "25%", "50%", "75%", "90%", "100%"]
      baseline_variant: "off"
      # M3-30 部署门校准（首批前）：P5 提案的 "0.5"/"0" 与 195 部署的 demo.flagd.json
      # 实际变体（off/10%/…/100%，baseline=off）不符，按部署事实校准（README §六 首批校准）
      caution: >-
        BA-19：flagd JSON 只许精确改写（目标 flag 的 defaultVariant 单键），
        禁 sed 正则批量替换（曾误伤 paymentServiceFailure 致整栈 500）
    expected_root_cause:                   # 取值域 = synonym-lexicon-v1.yml
      component: payment
      fault_type: BUSINESS_ERROR_RATE      # [P5 提案]（备料单"…"扩展位）
      reason_code: PAYMENT_CHARGE_FAILURE  # [P5 提案]
    expected_symptom_codes:
      - checkout                           # Sloth 烧损率告警（page/ticket 同名）
    expected_alerts:
      - alertname: checkout
        severity: page
        basis: 双窗（5m+1h）烧损率 > 14.4x 预算消耗速率
        labels_frozen: {alertname: checkout, service: checkout, sloth_severity: page, sloth_slo: availability, owner: am0}
      - alertname: checkout
        severity: ticket
        basis: 双窗（2h+1d）烧损率 > 3x（慢烧档，可能同批 firing）
        labels_frozen: {service: checkout, sloth_severity: ticket, sloth_slo: availability, owner: am0}
    recovery:
      criteria:                            # [文档已定] S1/S2 不复用 AM2 *_current==0（M3-17）
        - injection.flag 的 defaultVariant 归位 baseline_variant "0"
        - checkout page/ticket 全部 resolved，无残留 firing
        - checkout 可用性错误率回落预算内（slo:sli_error:ratio_rate5m 回落至阈值下）
      restore_probe: PromQL 查询 checkout 烧损率记录规则（场景专属恢复探针，M3-17）
    timing:                                # [P5 提案] v1 初值——首批评测前人工校准（M3-17 显式化要求）
      preheat_seconds: 60                  # 注入后流量爬坡预热
      hold_seconds: 600                    # 故障持续时间（for）
      max_firing_wait_seconds: 1500        # [M3-30 校准 2026-09-05] 600→1500：page 需 5m+1h 双窗同超
                                           # 14.4x；50% 失败档 1h 窗收敛实测需 ~17.3min（0.5·t/3600≥0.144），
                                           # 600s 实测必超时（E2E-M3-02b S1 两轮全 TIMEOUT 取证）。
                                           # 25min 预算留余量；G4 演练 3m17s 为高负载/暖窗条件，不可照搬
      max_resolved_wait_seconds: 2100      # [v2 校准 2026-09-09] 600→2100：checkout page 双分支
                                           # 含 30m+6h 窗（>6x 档），复位后 30m 窗稀释需 ~30min
                                           # （full-0910 批实测 600s 必超时，见文件头版本史）；
                                           # 2100 = 30min 稀释 + AM resolved 链延迟（~3min）+ 余量
      cleanup_timeout_seconds: 120

  # ---------------------------------------------------------------------------------
  - scenario_id: S2
    difficulty: L2                        # P6-G8（依赖不可达-单故障单症状）
    panel: false
    name: flagd paymentUnreachable
    fault_source: AM0 flagd
    scenario_type: 依赖不可达
    driver: FlagdScenarioDriver
    chaos_family: null
    target: payment
    injection:
      mechanism: >-
        flagd feature flag defaultVariant 切换，同 S1；由 FlagdScenarioDriver 落实。
        v3.0r1 冻结：S2 不再使用 docker kill payment——eval-runner 不持 docker socket（权限边界）
      flag: paymentUnreachable
      variant: "on"
      variant_space: ["on", "off"]
      baseline_variant: "off"
      caution: 同 S1（BA-19 精确改写纪律）
    expected_root_cause:
      component: payment
      fault_type: DEPENDENCY_UNREACHABLE   # [P5 提案]
      reason_code: PAYMENT_SERVICE_UNREACHABLE  # [P5 提案]
    expected_symptom_codes:
      - checkout
    expected_alerts:
      - alertname: checkout
        severity: page
        basis: payment 整体不可达 → checkout RPC 错误率抬升 → 同 S1 烧损率链路
        labels_frozen: {alertname: checkout, service: checkout, sloth_severity: page, sloth_slo: availability, owner: am0}
      - alertname: checkout
        severity: ticket
        basis: 慢烧档可能同批 firing
        labels_frozen: {service: checkout, sloth_severity: ticket, sloth_slo: availability, owner: am0}
    recovery:
      criteria:
        - injection.flag 的 defaultVariant 归位 baseline_variant "off"
        - checkout page/ticket 全部 resolved，无残留 firing
        - checkout 可用性错误率回落预算内
      restore_probe: 同 S1（PromQL 烧损率回落）
    timing:                                # [P5 提案] 初值同 S1，待校准
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 1500        # [M3-30 校准 2026-09-05] 同 S1：100% 失败档 1h 窗收敛 ~8.7min
                                           # 理论可入 600s，但双窗评估粒度 + 抖动下按 S1 同档 25min 留余量
      max_resolved_wait_seconds: 2100      # [v2 校准 2026-09-09] 同 S1：checkout page 30m+6h 窗稀释
                                           # 需 ~30min（复位判据与 S1 同一告警面），600s 必超时
      cleanup_timeout_seconds: 120

  # ---------------------------------------------------------------------------------
  - scenario_id: S3
    difficulty: L1                        # P6-G8（靶场 Gauge 单故障单症状直因，秒级 resolved）
    panel: true                           # P6-G8 SMOKE panel（快刷子集：靶场秒级三件套）
    name: F1 幂等失效
    fault_source: AM2 靶场
    scenario_type: 业务完整性
    driver: ArenaChaosScenarioDriver       # [文档已定] M3-17
    chaos_family: F1                       # [文档已定] arena.yml 告警标签 fault_type=F1（C-6 指纹输入面）
    target: order-arena chaos- 前缀评测流量
    injection:
      mechanism: >-
        chaos on(F1, scenario_id, config_digest, generation, TTL) + CHAOS_ADMIN_TOKEN，经 eval-mgmt
        私网调 ChaosController；激活事务三写（ground_truth + chaos_session(ACTIVE) + chaos_event），
        四 DB 约束生效（scenario_id 唯一 / 同 fault_type+target 唯一 ACTIVE / TTL 上下界 /
        ACTIVE 必有 GT）——AM2 §4.2 / M2-06 / M2-16
      effect: 对 chaos- 前缀流量跳过幂等机制（AM2 §6.2：F1 注入 = 幂等失效）
      selector_semantics: 仅命中 chaos- 前缀 intent 的流量，live 流量零污染（M2-18 live 零污染验收）
      ttl: 由 eval-runner 按本轮 timing 显式给定（不硬编码于此，须落 DB TTL 上下界内）
      token_discipline: CHAOS_ADMIN_TOKEN 仅 env 注入（INV-AM3-3），本文件不得携带
    expected_root_cause:
      component: order-arena
      fault_type: IDEMPOTENCY_BYPASS       # [文档已定] 备料单 P5 明示
      reason_code: DUPLICATE_CREATE_SAME_INTENT  # [P5 提案]
    expected_symptom_codes:
      - ArenaDuplicateOrders               # [文档已定] arena.yml 落码规则
    expected_alerts:
      - alertname: ArenaDuplicateOrders
        severity: page
        basis: oa_duplicate_orders_current > 0（同 intent 多个未废订单）
        labels_frozen: {alertname: ArenaDuplicateOrders, service: order-arena, fault_type: F1}   # C-6 冻结标签集（arena.yml 头注）
    recovery:
      criteria:                            # [文档已定] AM2 §6.7 恢复确认三条件 + C-4
        - chaos off → CAS ACTIVE→RECOVERING→CLOSED，F1 恢复算法执行（canonical 保留、其余废单、资源按台账反向补偿）
        - oa_duplicate_orders_current == 0
        - 无残留 firing + 补偿台账清平
      restore_probe: oa_duplicate_orders_current 归零（Gauge 真值，M2-21）
    timing:                                # [P5 提案] 初值——靶场 Gauge 面 15s 评估间隔，firing 应快于 AM0
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 300
      max_resolved_wait_seconds: 600       # off 后修复算法执行 + Gauge 归零 + 台账清平
      cleanup_timeout_seconds: 120

  # ---------------------------------------------------------------------------------
  - scenario_id: S4
    difficulty: L1                        # P6-G8
    panel: true                           # P6-G8 SMOKE panel
    name: F2 状态回跳
    fault_source: AM2 靶场
    scenario_type: 状态机非法迁移
    driver: ArenaChaosScenarioDriver
    chaos_family: F2
    target: order-arena 指定目标订单（精确目标、非目标不变）
    injection:
      mechanism: 同 S3（chaos on 激活事务 + 四约束 + TTL）
      effect: >-
        chaos 流量上绕过状态机直接 UPDATE 状态字段（状态回跳，模拟"setter 直改状态"事故源）——
        AM2 §6.4；DomainProbe 独立校验"状态 × 台账事实"合法性（不用状态机验证状态机）
      selector_semantics: 精确目标订单回跳、非目标订单不变（M2-19 验收）
      ttl: 同 S3（eval-runner 显式给定）
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: ILLEGAL_STATE_TRANSITION # [文档已定] 备料单 P5 明示
      reason_code: STATE_ROLLBACK_DIRECT_WRITE   # [P5 提案]
    expected_symptom_codes:
      - ArenaIllegalTransitions            # [文档已定] arena.yml 落码规则
    expected_alerts:
      - alertname: ArenaIllegalTransitions
        severity: page
        basis: oa_state_violations_current > 0（回跳签名 / PAID 无支付事实）
        labels_frozen: {alertname: ArenaIllegalTransitions, service: order-arena, fault_type: F2}
    recovery:
      criteria:
        - chaos off → F2 恢复算法执行：按支付/履约/资源事实恢复合法状态组合；无法确定 → 废单终态（C-4）
        - oa_state_violations_current == 0
        - 无残留 firing + 补偿台账清平
      restore_probe: oa_state_violations_current 归零
      note: >-
        指标名以 arena.yml 落码为准（oa_state_violations_current）；AM2 技术方案 §6.6 行 202 写
        oa_illegal_transitions_current，属文档-落码分歧，已提请主会话核对（README §7）
    timing:                                # [P5 提案] 初值同 S3
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 300
      max_resolved_wait_seconds: 600
      cleanup_timeout_seconds: 120

  # ---------------------------------------------------------------------------------
  - scenario_id: S5
    difficulty: L1                        # P6-G8
    panel: true                           # P6-G8 SMOKE panel
    name: F3 超时结果未知
    fault_source: AM2 靶场
    scenario_type: 中间态悬挂
    driver: ArenaChaosScenarioDriver
    chaos_family: F3
    target: order-arena chaos- 前缀评测流量的支付路径
    injection:
      mechanism: 同 S3（chaos on 激活事务 + 四约束 + TTL）
      effect: >-
        pay 路径超时挂起：订单停留 CREATED、资源悬挂，进入 UNKNOWN→RECONCILING→ENABLED/DISCARDED
        持久化状态机（SIGKILL 后续跑，禁固定 sleep 表达状态）——M2-20 / AM2 §4.2
      selector_semantics: 仅 chaos- 前缀流量命中，ENABLE 前挂起（AM2 §4.2 时序）
      ttl: 同 S3（eval-runner 显式给定）
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: UNCERTAIN_TIMEOUT        # [文档已定] 备料单 P5 明示
      reason_code: PAYMENT_OUTCOME_UNKNOWN # [P5 提案]
    expected_symptom_codes:
      - ArenaOrderStuck                    # [文档已定] arena.yml 落码规则
    expected_alerts:
      - alertname: ArenaOrderStuck
        severity: page
        basis: oa_stuck_orders_current > 0（CREATED 停留超阈值）
        labels_frozen: {alertname: ArenaOrderStuck, service: order-arena, fault_type: F3}
    recovery:
      criteria:
        - chaos off → F3ReconcileService 对账收敛（UNKNOWN→RECONCILING→ENABLED/DISCARDED），悬挂台账清平（C-4）
        - oa_stuck_orders_current == 0
        - 无残留 firing + 补偿台账清平
      restore_probe: oa_stuck_orders_current 归零
      note: 辅助规则 ArenaDomainProbeDown（探针失明）不属于任何场景的期望症状；
            其 firing = 探测面故障/场景配置错误信号，不得计入 symptom_coverage
    timing:                                # [P5 提案] 初值同 S3
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 300
      max_resolved_wait_seconds: 600
      cleanup_timeout_seconds: 120

  # =================================================================================
  # M-a 业务扩编（v3，2026-09-18）：I 类业务交易链路 S16~S25
  # 共同特征（设计 §3.1）：技术指标全部正常或仅轻微异常，只有业务计数/对账指标暴露问题；
  # 告警面全部落在 arena-business.yml 业务埋点指标（INV-AM2-5：DomainProbe 探测产物）。
  # 扩展键 partition / complexity / expected_evidence_checkpoints / expected_behavior_note
  # 为白名单外注记——GoldenScenarioRegistry 只读已知键、未知键忽略（装载器头注），
  # "只增不改"纪律下旧装载器不因新键失效；E2 检查点判定器（M-b）消费 checkpoints。
  # HOLDOUT H7（F18_PRICE_CALC 金额错算）/H8（缓存-DB 不一致）按 §3.5 只留设计、不进本
  # 注册表（RLS 封存；M-e HOLDOUT 实例化批次处理）。
  # =================================================================================

  # ---------------------------------------------------------------------------------
  - scenario_id: S16                        # [文档已定] v2 设计 §3.1
    difficulty: L2                        # P6-G8（业务对账型单根因-技术指标全绿）
    panel: false
    name: F9 掉单（支付成功订单未推进）
    fault_source: AM2 靶场
    scenario_type: 业务交易链路-掉单
    driver: ArenaChaosScenarioDriver
    chaos_family: F9
    target: order-arena chaos- 前缀评测流量的支付收口路径
    partition: TUNING                       # [文档已定] v2 设计 §6.2
    complexity: 单根因-业务对账型           # [文档已定] "技术指标全绿但业务不一致"教学范式
    injection:
      mechanism: 同 S3（chaos on 激活事务 + 四约束 + TTL；FaultType=F9_CALLBACK_DROP）
      effect: >-
        支付网关 capture 成功后故障点跳过 markPaid 收口——支付侧成功事实落库、订单侧不推进
        （掉单）；故障点静默、无错误日志（设计 §3.1 S16 机理）
      selector_semantics: 仅 chaos- 前缀 correlationId 命中，live 流量零污染
      ttl: 由 eval-runner 按本轮 timing 显式给定（须落 DB TTL 上下界内）
      token_discipline: CHAOS_ADMIN_TOKEN 仅 env 注入（INV-AM3-3），本文件不携带
    expected_root_cause:
      component: order-arena                # 回调收口环节在 order-arena（设计稿 order-arena/payment-callback 的模块限定）
      fault_type: business.order_lost
      reason_code: F9_CALLBACK_DROP
    expected_symptom_codes:
      - ArenaPaymentOrderMismatch           # [文档已定] arena-business.yml 落码规则
    expected_alerts:
      - alertname: ArenaPaymentOrderMismatch
        severity: page
        basis: oa_payment_order_mismatch_current > 0（探测面检出：CAPTURE 成功 × 订单未推进）
        labels_frozen: {alertname: ArenaPaymentOrderMismatch, service: order-arena, fault_type: F9}
    expected_evidence_checkpoints:          # [文档已定] §3.1 S16；E8 业务量化（M-b）消费
      - 对比支付成功数与订单创建数两条业务曲线（查错误日志无果——故障点静默）
      - 定位回调收口环节（markPaid 缺失）
      - 量化掉单量（估计误差 ≤20% 算命中）
    expected_behavior_note: >-
      工具序列骨架=业务计数对比→对账明细查询→根因环节定位；应引用 oa_payments_success_total /
      oa_payment_order_mismatch_current 证据源；不应以"无错误日志"为由拒答
    recovery:
      criteria:                              # 沿 S3~S5 三条件 + C-4
        - chaos off → CAS ACTIVE→RECOVERING→CLOSED（恢复面 F9 → 注入关闭即恢复，新流量不再掉单）
        - oa_payment_order_mismatch_current == 0（存量掉单经既有对账/补偿面收敛后归零）
        - 无残留 firing + 补偿台账清平
      restore_probe: oa_payment_order_mismatch_current 归零（Gauge 真值，M2-21 同源）
      note: 存量掉单收敛依赖既有 UNKNOWN 对账/补偿机制（M2-20 面）；T8 演练实测后回填校准
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 300          # 探测 gauge 面 30s 周期，秒级检出
      max_resolved_wait_seconds: 600
      cleanup_timeout_seconds: 120

