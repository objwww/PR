    fault_source: AM2 靶场                  # 复合低剂量（F1 低比例 + 下游小延迟）
    scenario_type: 业务交易链路-KPI 下跌
    driver: ArenaChaosScenarioDriver        # M-b 起双 driver 协同（chaos + flagd 延迟）
    chaos_family: COMPOSITE_LOW_DOSE        # 告警标签面 fault_type（arena-business.yml S23 行）
    target: order-arena chaos- 前缀评测流量的下单全链路
    partition: TUNING                       # [文档已定] §6.2
    complexity: 多因素低剂量                # [文档已定] 业务 SLO 驱动诊断的范式教学
    injection:
      mechanism: >-
        [部分验证] M-a 只交付告警规则面+本注册（ArenaOrderSuccessRateLow promtool 绿）；
        复合注入本体 = chaos F1 低比例（2%）+ flagd 下游小延迟（200ms）双 driver 协同，
        依赖 M-b C3 复合激活（DB 约束放宽"同 scenario 多 fault"）后启用跑批
      effect: >-
        每条技术指标单独看都不越阈，但业务成功率从 ~99.5% 跌到 ~96%（设计 §3.1 S23 机理）
      selector_semantics: 仅 chaos- 前缀命中（F1 面），延迟面 flagd 全局——演练须全 chaos-
        隔离面运行（execution_contract.traffic_isolation）
      ttl: 同 S3
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: business.kpi_degradation
      reason_code: COMPOSITE_LOW_DOSE
    expected_symptom_codes:
      - ArenaOrderSuccessRateLow
    expected_alerts:
      - alertname: ArenaOrderSuccessRateLow
        severity: page
        basis: sum(rate(oa_orders_success_total[5m])) / sum(rate(oa_orders_total[5m])) < 0.98 持续 5m
        labels_frozen: {alertname: ArenaOrderSuccessRateLow, service: order-arena, fault_type: COMPOSITE_LOW_DOSE}
    expected_evidence_checkpoints:
      - 从业务 KPI 反推技术贡献分解
      - 识别多因素叠加（幂等失效低比例 + 下游延迟）
      - 避免强行归因单根因——输出"双因素贡献拆分"才算满分，只答一个=部分命中（E3 评分器，M-b）
    expected_behavior_note: >-
      多根因场景（S15 之后的第二个复合点）——评分器集合匹配+部分分依赖 M-b E3；
      sum() 全局口径要求演练在全 chaos- 隔离面运行（live 基线并存时稀释成功率）
    recovery:
      criteria:
        - 复合注入全部归零（F1 比例归零 + 延迟归零）→ 成功率回升 ≥0.98
        - 告警 resolved 无残留 firing
        - 无补偿台账残留
      restore_probe: oa_orders_success_total / oa_orders_total 速率比回升 0.98 上
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 900          # rate 5m 窗 + for 5m
      max_resolved_wait_seconds: 900
      cleanup_timeout_seconds: 120

