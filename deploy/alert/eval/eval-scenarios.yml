  - scenario_id: S25
    difficulty: L2                        # P6-G8（依赖不可达-单故障单症状）
    panel: false
    name: F17 履约超时积压
    fault_source: AM2 靶场
    scenario_type: 业务交易链路-履约积压
    driver: ArenaChaosScenarioDriver
    chaos_family: F17
    target: order-arena chaos- 前缀评测流量的履约收口路径
    partition: VALIDATION                   # [文档已定] §6.2
    complexity: 单根因                      # [文档已定] 告警在链路下游，诱导归因到下单环节
    injection:
      mechanism: 同 S3（chaos on；FaultType=F17_FULFILL_SLOW）
      effect: >-
        履约收口故障点 enableBookingOnly——履约单停 CONFIRMING 不再推进，SLA 超时积压；
        下单链路完全正常（设计 §3.1 S25 机理）
      selector_semantics: 仅 chaos- 前缀命中，live 流量零污染
      ttl: 同 S3
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: business.fulfillment_timeout
      reason_code: F17_FULFILL_SLOW
    expected_symptom_codes:
      - ArenaFulfillmentSlaBreach
    expected_alerts:
      - alertname: ArenaFulfillmentSlaBreach
        severity: ticket
        basis: oa_fulfillment_overdue_current > 15（CONFIRMING 超龄积压）
        labels_frozen: {alertname: ArenaFulfillmentSlaBreach, service: order-arena, fault_type: F17}
    expected_evidence_checkpoints:
      - 积压趋势识别（CONFIRMING 停留时长分布）
      - 定位履约环节而非下单环节（告警在下游——诱导归因错误的反面教材）
      - SLA 影响量化（超龄单量）
    expected_behavior_note: >-
      应引用 oa_fulfillment_overdue_current 与履约单状态查询；结论必须落在履约收口
      而非下单链路（下游告警的归因诱导面）
    recovery:
      criteria:
        - chaos off → 恢复面 F17 → 注入关闭即恢复（新订单履约正常收口）
        - oa_fulfillment_overdue_current 回落阈值（15）下
        - 无残留 firing
      restore_probe: oa_fulfillment_overdue_current 回落阈值下
      note: 存量 CONFIRMING 积压单的收敛（补收口/补偿面）在 T9 演练实测校准
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 600          # gauge 需积压 >15
      max_resolved_wait_seconds: 900
      cleanup_timeout_seconds: 120

# -------------------------------------------------------------------------------------
# 与 ScenarioMapExportV1（AM2 M2-24）的字段对齐（消费方 AM3 M3-10）
# 本文件 = 激活前的"预登记面"；ExportV1 = 激活后按 C-6 归属算法回填的"运行时面"。
# digest 纪律（M2-24 契约测试）：digest 稳定、字段顺序不影响 canonical digest、未知 fault_type/reason_code 拒绝
# -------------------------------------------------------------------------------------
scenario_map_export_mapping:
  schema_version: ExportV1.schema_version（导出时写 1）
  provided_by_this_registry:              # 激活前即确定，来自上方 scenarios[]
    - scenario_id
    - target
    - expected_root_cause{component, fault_type, reason_code}
    - expected_symptom_codes[]
  filled_at_activation:                   # 激活事务/激活回执产生（C-5/C-6，M3-17 ActivationReceipt）
    - activation_generation
    - payload_digest
    - created_at
    - alert_identity_digest               # 按 expected_alerts.labels_frozen + metric 携带 job/instance 预计算
    - alert_fingerprint                   # 与 Alertmanager 同算法（C-6）
  backfilled_by_am2_pipeline:             # 事件游标 + generation CAS 回填（C-6）
    - incident_id
    - incident_generation
  am2_nullable:                           # M2-24 原文：AM2 可为空
    - run_id
    - report_id
  fault_type_vocabulary_note: >-
    [P5 提案，待主会话确认] 本注册表顶层 fault_type 一律取语义枚举（= lexicon.fault_types，
    与 expected_root_cause.fault_type 同值域），保证 S1/S2（无靶场故障族）与 S3~S5 同构；
    靶场告警标签面上的 fault_type=F1/F2/F3 单列于 chaos_family 与 expected_alerts.labels_frozen，
    两者是不同值域（语义枚举 vs 故障族代号），C-6 指纹消费的是后者。
  fault_type_vocabulary_note_v3: >-
    v3 扩编沿用同构原则：S16~S25 顶层 fault_type 取语义枚举（business.*，v2 设计 §3.1 原文
    取值），已扩入同目录 synonym-lexicon-v1.yml（v2 词表，lexicon_version: 2）；靶场告警标签面
    fault_type=F9~F17 / COMPOSITE_LOW_DOSE 单列于 chaos_family 与 labels_frozen。
    ExportV1 的"未知 fault_type/reason_code 拒绝"按词表当前版本判定（M2-24 契约）。
