  - scenario_id: S24
    difficulty: L2                        # P6-G8（教学-考试对教侧）
    panel: false
    name: F16 断流（零订单）
    fault_source: AM2 靶场
    scenario_type: 业务交易链路-断流
    driver: ArenaChaosScenarioDriver
    chaos_family: F16
    target: order-arena chaos- 前缀评测流量的创单入口
    partition: VALIDATION                   # [文档已定] §6.2；教学-考试对（教 S24 → 考 H6 静默盲区）
    complexity: 单根因                      # [文档已定] H6 静默场景的教学前置
    injection:
      mechanism: 同 S3（chaos on；FaultType=F16_INGRESS_SILENT）
      effect: >-
        入口静默——create() 直接返回 accepted 零落单，订单创建计数归零
        （设计 §3.1 S24 机理；白天基线下 5 分钟零订单即断流）
      selector_semantics: 仅 chaos- 前缀命中，live 流量零污染
      ttl: 同 S3
      token_discipline: 同 S3
    expected_root_cause:
      component: order-arena
      fault_type: business.zero_flow
      reason_code: F16_INGRESS_SILENT
    expected_symptom_codes:
      - ArenaOrderZeroFlow
    expected_alerts:
      - alertname: ArenaOrderZeroFlow
        severity: page
        basis: sum(rate(oa_orders_total[5m])) == 0 持续 5m
        labels_frozen: {alertname: ArenaOrderZeroFlow, service: order-arena, fault_type: F16}
    expected_evidence_checkpoints:
      - 区分"真断流"与"指标采集断了"（查探针自证 oa_domain_probe_up——H6 教学前置）
      - 定位入口环节（create() 静默拒绝）
      - 排除流量发生器侧解释（发生器仍在投递）
    expected_behavior_note: >-
      sum() 全局口径在 live 基线并存时不会归零——演练按执行契约 traffic_isolation
      全 chaos- 面运行；Agent 应先查探针自证再下"断流"结论
    recovery:
      criteria:
        - chaos off → 恢复面 F16 → 注入关闭即恢复（创单入口重新放行）
        - oa_orders_created_total 速率恢复非零
        - 无残留 firing
      restore_probe: 订单创建速率恢复 > 0
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 900          # rate 5m 归零窗 + for 5m
      max_resolved_wait_seconds: 900        # 复位后 5m 零窗稀释
      cleanup_timeout_seconds: 120

