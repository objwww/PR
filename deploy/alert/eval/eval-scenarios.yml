    chaos_family: F11
    target: order-arena chaos- 前缀评测流量的支付重试路径
    partition: TUNING                       # [文档已定] §6.2
    complexity: 单根因-跨层鉴别对           # [文档已定] 与 S3（订单层幂等）跨层鉴别
    injection:
      mechanism: 同 S3（chaos on；FaultType=F11_DOUBLE_CHARGE）
      effect: >-
        支付重试故障点跳过已支付闸——已 PAID 订单放行重复 capture，同订单多笔支付成功
