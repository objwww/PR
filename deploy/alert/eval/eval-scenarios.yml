    expected_alerts:
      - alertname: ArenaReconciliationDiff
        severity: page
        basis: abs(oa_recon_diff_current) > 0（对账作业差异明细见 /orders/recon/diffs）
        labels_frozen: {alertname: ArenaReconciliationDiff, service: order-arena, fault_type: F12}
