      criteria:
        - chaos off → 恢复面 F11 → 注入关闭即恢复（已支付闸重新生效）
        - oa_duplicate_payments_current == 0
        - 无残留 firing + 重复扣款订单的退赔台账清平
      restore_probe: oa_duplicate_payments_current 归零
      note: 存量重复扣款的退赔路径（refund 链）在 T8 演练实测校准
    timing:
