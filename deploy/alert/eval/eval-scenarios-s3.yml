# =====================================================================================
# E2E-M3-01 黄金链专用注册表（单场景 S3 ×2 轮；M3-30 部署门辅助文件）
# 全量五场景批量用 eval-scenarios.yml；本文件 = 同一 S3 场景块的子集视图，
# 字段与主文件一致（改主文件时同步此处；差异 = 只保留 S3）。
# =====================================================================================

registry_version: 1
schema_version: 1
lexicon_binding: "synonym-lexicon-v1.yml (lexicon_version: 1)"

scenarios:

  - scenario_id: S3
    name: F1 幂等失效（黄金链）
    fault_source: AM2 靶场
    scenario_type: 业务完整性
    driver: ArenaChaosScenarioDriver
    chaos_family: F1
    target: order-arena chaos- 前缀评测流量
    injection:
      mechanism: >-
        chaos on(F1, scenario_id, config_digest, generation, TTL) + CHAOS_ADMIN_TOKEN；
        激活后由 ArenaChaosScenarioDriver 注入 chaos 前缀评测流量（同 intent 三单 → 幂等旁路）
    effect: 对 chaos- 前缀流量跳过幂等机制（AM2 §6.2）
    selector_semantics: 仅命中 chaos- 前缀 intent 的流量，live 流量零污染
    ttl: 由 eval-runner 按本轮 timing 显式给定
    token_discipline: CHAOS_ADMIN_TOKEN 仅 env 注入（INV-AM3-3），本文件不得携带
    expected_root_cause:
      component: order-arena
      fault_type: IDEMPOTENCY_BYPASS
      reason_code: DUPLICATE_CREATE_SAME_INTENT
    expected_symptom_codes:
      - ArenaDuplicateOrders
    expected_alerts:
      - alertname: ArenaDuplicateOrders
        severity: page
        basis: oa_duplicate_orders_current > 0（同 intent 多个未废订单）
        labels_frozen: {alertname: ArenaDuplicateOrders, service: order-arena, fault_type: F1}   # C-6 冻结标签集
    recovery:
      criteria:
        - chaos off → CAS ACTIVE→RECOVERING→CLOSED，F1 恢复算法执行
        - oa_duplicate_orders_current == 0
        - 无残留 firing + 补偿台账清平
      restore_probe: oa_duplicate_orders_current 归零（Gauge 真值，M2-21）
    timing:
      preheat_seconds: 60
      hold_seconds: 600
      max_firing_wait_seconds: 300
      max_resolved_wait_seconds: 600
      cleanup_timeout_seconds: 120
