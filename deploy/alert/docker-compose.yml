# AM0 手工配置回收 + G0-10 告警链路接线（docs/告警G0-收口技术方案.md）
#
# 来源：195:/opt/projects/alert_agent 下散置的手工 compose/配置（AM0 部署验证期产物）。
# 本文件聚合 AM0 实测参数（镜像 tag、内存上限、安全项、127.0.0.1 端口绑定），与 195
# 实机 docker inspect 核对一致；配置文件本体在同级目录（SHA-256 清单见 README.md）。
#
# G0-10 接线（相对 AM0 实测形态的变更，均有方案依据）：
#   - alertmanager webhook 由 echo-receiver 切到 control-app /webhooks/alertmanager
#     （bearer 走 credentials_file 运行时挂载）；alertmanager 追加挂 alert-net
#   - holmesgpt 由 sleep 常驻(CLI exec)升级为 server 形态(HOLMES_PORT=8080,
#     /api/chat + X-API-Key;镜像 local/holmesgpt:am1-http)
#
# 网络拓扑：
#   - prometheus/alertmanager 挂 opentelemetry-demo 外部网（抓 otel-collector:9464 指标；
#     collector 的 prometheus exporter 由 deploy/alert/otelcol/otelcol-config-extras.yml 加装）
#   - alert-net 外部共享网：holmes(别名 holmes) / alertmanager / control-app(主栈 compose 挂入)
#     / order-arena(AM2) / arena-migrate / postgres(主栈 compose 挂入，AM2 起供 arena 域触库)
#   - eval-mgmt 外部私网（--internal，无宿主端口、无外网出口）：仅 arena-chaos-admin(AM2)；
#     AM3 的 eval-runner 届时加入。业务 order-arena 对 eval-mgmt 零成员（C-3 裁定：
#     "同容器双网监听"不成立，管理面必须拆独立服务/独立容器）
#   - 全部端口仅绑 127.0.0.1，公网零暴露（INV-AM0-1）；arena-chaos-admin 无宿主端口
#
# AM3（M3-24）LiteLLM proxy 收口（§6.6，spike Exp5 实证）：
#   - litellm 容器 = 模型调用唯一出口（P-12 账本盲区收口 + per-EvalRun 预算硬拦/对账）；
#     holmes 的 OPENAI_API_BASE 指向 proxy，proxy 不可达即调查失败（fail-closed，
#     无直连百炼回退路径——E2E-M3-06 断言面）
#   - litellm-bootstrap 一次性建 litellm 角色/库（SpendLogs + 虚拟 key 台账，Prisma 自建表）

services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.1
    container_name: prometheus-am0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    mem_limit: 300m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - opentelemetry-demo
      # G0-10 E2E 修正(BA-14 后续):holmes 的 Prometheus 工具集需要可达的 PROMETHEUS_URL,
      # prometheus 挂入 alert-net 以便 holmes 以容器名直连
      - alert-net

  alertmanager:
    image: prom/alertmanager:latest   # AM0 实测即 latest（G0-10 部署前按需 pin）
    container_name: alertmanager-am0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # webhook bearer 只走运行时文件(195 上由 deploy/.env 派生,.gitignore 排除)
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - opentelemetry-demo
      - alert-net

  holmesgpt:
    build: ./holmesgpt
    image: local/holmesgpt:am1-http
    container_name: holmesgpt-am1
    restart: unless-stopped
    # G0-10:HTTP /api/chat 服务形态(§6.5;Dockerfile 内 ENTRYPOINT python server.py)
    environment:
      HOLMES_PORT: "8080"
      HOLMES_API_KEY: "${HOLMES_API_KEY:?}"          # server 侧鉴权(control-app 同值外带 X-API-Key)
      MODEL: "openai/deepseek-v3"                    # 默认模型;须与 litellm config.yaml model_name 对齐
      # AM3（M3-24）：模型调用全部收口 LiteLLM proxy（§6.6）——原直连百炼的两变量移交 proxy
      OPENAI_API_BASE: "http://litellm:4000/v1"
      OPENAI_API_KEY: "${LITELLM_RUN_KEY:?}"         # per-EvalRun 虚拟 key（部署侧铸后写入 .env；
                                                     # master key 不进 holmes；换 run = 换 key 重启本容器）
      # G0-10 E2E 修正:不设则 prometheus 工具集被前置检查禁用,模型只能拿 kubectl 瞎撞
      PROMETHEUS_URL: "http://prometheus-am0:9090"
      HOME: "/tmp"
    mem_limit: 1536m
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:exec,size=512m
    networks:
      alert-net:
        aliases:
          - holmes    # control-app 的 HOLMES_BASE_URL=http://holmes:8080 经此别名解析

  # ---------------------------------------------------------------- AM2 订单靶场（M2-01/02，C-3 拓扑）

  arena-migrate:
    # arena 域 Flyway one-shot（V1~V5，owner 身份）：schema/角色 DO 块/业务表/outbox/
    # chaos+GT/scenario_map。与主栈 migrate 的关系：不同 schema（arena vs public），
    # 各自的 flyway_schema_history 落在自己 schema 内，互不干扰。
    # 前置：主栈（deploy/docker-compose.yml 的 postgres）先起——跨 compose 项目无法
    # depends_on，靠 flyway -connectRetries 兜底；部署顺序 = 主栈 → alert 栈。
    image: flyway/flyway:10-alpine
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pr_agent}
      FLYWAY_USER: postgres # owner 身份（DDL + 角色 DO 块）；该凭证不进入任何业务容器
      FLYWAY_PASSWORD: "${POSTGRES_PASSWORD:?}"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_SCHEMAS: arena  # 首个 schema = default schema，历史表落 arena.flyway_schema_history
      # V1 角色 DO 块的密码 placeholder（与主栈 .env 三键同值）
      FLYWAY_PLACEHOLDERS_ARENA_PASSWORD: "${ARENA_DB_PASSWORD:?}"
      FLYWAY_PLACEHOLDERS_CHAOS_ADMIN_PASSWORD: "${CHAOS_ADMIN_DB_PASSWORD:?}"
      FLYWAY_PLACEHOLDERS_EVAL_PASSWORD: "${EVAL_DB_PASSWORD:?}"
    volumes:
      # 直挂 order-arena 资源目录（单一事实源，与主栈 migrate 同纪律）；
      # 本 compose 位于 deploy/alert/，仓库根需再上一级
      - ../../order-arena/src/main/resources/db/migration:/flyway/sql:ro
    command: ["-connectRetries=30", "migrate"]
    networks:
      - alert-net

  order-arena:
    build:
      context: ../../order-arena
    image: pr-agent/order-arena:0.0.1-SNAPSHOT
    restart: unless-stopped
    depends_on:
      - arena-migrate   # 顺序意图（跨栈 DB 就绪靠应用侧重试；migrate 幂等可重跑）
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pr_agent}
      ARENA_DB_PASSWORD: "${ARENA_DB_PASSWORD:?}"
      # 有界流量发生器（M2-15）：docker 栈内默认开启（live- 正常流量）
      TRAFFIC_ENABLED: "${TRAFFIC_ENABLED:-true}"
    ports:
      # 仅绑 loopback（业务 API 供 DP-C02/E2E 取证走 SSH 隧道；与 control-app 同纪律）
      - "${ARENA_BIND:-127.0.0.1}:${ARENA_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m          # M2-01 冻结：靶场含内嵌流量发生器 ≤ 512MiB（AM2 v3.0 §6.8）
    mem_reservation: 256m
    healthcheck:
      # 基底 Ubuntu 26.04 的 bash 5.3 编译时关了 /dev/tcp 网络重定向（实测 No such file）；
      # 镜像自带 wget（无 curl），healthz 仅容器内可达
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alert-net     # C-3：业务容器只在 alert-net，eval-mgmt 零成员

  arena-chaos-admin:
    build:
      context: ../../arena-chaos-admin
    image: pr-agent/arena-chaos-admin:0.0.1-SNAPSHOT
    restart: unless-stopped
    depends_on:
      - arena-migrate
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pr_agent}
      CHAOS_ADMIN_DB_PASSWORD: "${CHAOS_ADMIN_DB_PASSWORD:?}"
      CHAOS_ADMIN_TOKEN: "${CHAOS_ADMIN_TOKEN:?}"
    # 无 ports：管理面零宿主端口（M2-17 断言面之一）；可达性只经 eval-mgmt
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    healthcheck:
      # 同 order-arena：wget 拉 /healthz（bash 5.3 无 /dev/tcp）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - eval-mgmt     # C-3：管理面只入 eval-mgmt；alert-net/Holmes 不可达（M2-17 195 断言）

  # ---------------------------------------------------------------- AM3 LiteLLM proxy 收口（M3-24，§6.6）

  litellm-bootstrap:
    # litellm 台账库自举（幂等可重跑）：litellm 角色 + litellm 库（Prisma 自建
    # LiteLLM_SpendLogs/虚拟 key 表）。只跑 psql 不 initdb → INC-09 seccomp 坑不涉及；
    # 跨栈 depends_on 不可达，靠 pg_isready 轮询 + proxy 侧重试（arena-migrate 同纪律）
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: "${POSTGRES_PASSWORD:?}"
      LITELLM_DB_PASSWORD: "${LITELLM_DB_PASSWORD:?}"
    entrypoint:
      - sh
      - -c
      - |
        until pg_isready -h postgres -U postgres >/dev/null 2>&1; do sleep 2; done
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='litellm'" | grep -q 1 \
          || psql -c "CREATE ROLE litellm LOGIN PASSWORD '$$LITELLM_DB_PASSWORD'"
        psql -c "ALTER ROLE litellm LOGIN PASSWORD '$$LITELLM_DB_PASSWORD'"
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1 \
          || psql -c "CREATE DATABASE litellm OWNER litellm"
        echo "litellm-bootstrap done"
    networks:
      - alert-net

  litellm:
    # 模型调用唯一出口（P-12 账本盲区收口）。镜像按 spike 结论取官方
    # docker.io/litellm/litellm:1.89.0（与 holmes 内 litellm 客户端同版，195 镜像加速可拉）；
    # 方案原文"ghcr + crane 摆渡（BA-01）"保留为兜底。holmes 镜像内 pip 装
    # litellm[proxy] 缺 Prisma binaries 起不来（P1 spike take-1 负结论，不可走）。
    image: litellm/litellm:1.89.0
    container_name: litellm-am3
    restart: unless-stopped
    depends_on:
      - litellm-bootstrap
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "true"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?}"   # 仅 env 注入（INV-AM3-3 同纪律），永不入 git
      UPSTREAM_BASE: "${OPENAI_API_BASE}"             # 上游=百炼兼容端点（原 holmes 直连参数移交 proxy）
      UPSTREAM_KEY: "${AGENT_MODEL_API_KEY:?}"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - litellm-logs:/app/logs                        # 日志卷：卷面 chmod 600 纪律（README）
    ports:
      - "127.0.0.1:4100:4000"                         # 仅 loopback：operator 铸 per-EvalRun 虚拟 key 用（host 4000 被 flagd-ui 占用）
    mem_limit: 1536m                                  # §6.8 冻结值 512M 与 litellm 1.89.0 实测冲突：
                                                      # 启动峰值 1013MiB（M3-30 部署实测，512M 下 OOM-137 循环）→ 放宽至 1.5G，台账已记
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      # 镜像为 python slim（无 curl/wget）；/health/liveliness 为 litellm 内建存活口
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s   # 首启跑 Prisma migrate（spike 实测起得慢）
    networks:
      - alert-net

  flagd-admin:
    # flagd defaultVariant 单键改写侧车（AM3 M3-17/M3-30；S1/S2 场景注入执行器，
    # BA-19 单键纪律落码）。与 flagd 共享 demo.flagd.json 卷面（flagd file 源
    # inotify 热加载，无需重启）；仅 eval-mgmt 私网可达、无宿主端口、零密钥面
    # （INV-AM3-4 评测边界：只写 flags 文件，不触 docker socket）。
    build: ./flagd-admin
    image: pr-agent/flagd-admin:0.0.1-SNAPSHOT
    container_name: flagd-admin-am3
    restart: unless-stopped
    environment:
      FLAGD_FILE: /flags/demo.flagd.json
    volumes:
      - ${FLAGD_FLAGS_DIR:-/opt/build/opentelemetry-demo/src/flagd}:/flags
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
    networks:
      - eval-mgmt

networks:
  opentelemetry-demo:
    external: true        # otel demo 栈已建网（195 上同名）
  # alert-net 为跨栈共享网（control-app/告警源都挂）：预先 `docker network create alert-net`
  # 后按 external 引用，避免多个 compose 项目争建同名网（label 不一致会冲突）
  alert-net:
    external: true
    name: alert-net
  eval-mgmt:
    external: true        # AM2 建立的评测私网（chaos-admin/postgres/eval-runner/flagd-admin）
    name: eval-mgmt
  # eval-mgmt 私网（AM2 C-3）：预先 `docker network create eval-mgmt --internal`；
  # 主栈 postgres 挂入它 + alert-net（deploy/docker-compose.yml），为 arena/admin 两角色触库

volumes:
  litellm-logs:   # litellm proxy 日志（M3-24）；宿主侧权限纪律见 README「LiteLLM」节
