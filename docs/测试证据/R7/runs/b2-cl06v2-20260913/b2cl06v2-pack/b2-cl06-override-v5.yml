# v5.2（20260913）：v5.1 三有效试验推进到 phase9 后全 FAIL@「记忆行 1（<2）」——
# 主 Agent 把直查压成一轮（steps=1→STEP_COMPLETED 记忆行=1）。取证链：子任务=确定性
# 单工具角色（g2 metrics 角色固定 prometheus.query），NativeInvestigationExecutor
# .submitDelegationReceipt 成功路径硬编码 counterRefs=List.of()/missing=空——
# counter_evidence_refs 非空结构性不可达，witness 仅 FAILED 子任务 open_gaps 可达
# 且失败面不可由 prompt 引导。v5.1 的「委派纪律」段作废（引导不可能之事）。
# v5.2 只修步面：两批委派之间强制插入独立直查步（steps≥2→记忆行≥2），
# 预期终点=verify2 INCONCLUSIVE(3)（结构过/witness 恒空——如实报）。
services:
  control-app:
    environment:
      APP_ALERT_R7_INPUTCAPTURE: "full"
      APP_ALERT_R7_PRIMARY_MAX_DELEGATION_BATCHES: "2"
      APP_ALERT_R7_PRIMARY_PROMPT: "你是主调查 Agent：直接受限取证，按需委派专家，最终以带引用 Claim 收敛。硬性顺序（多信号场景，两批委派）：①先用 prometheus.query 查 sum by (rpc_method,error_type)(rpc_client_call_duration_seconds_count{service_name=\"checkout\"})——带 error_type（如 UNKNOWN）的系列计数持续累积=依赖故障面；②再以 delegate 分支委派 logs 专家（gap_id=g1）取证日志面；③g1 回执到齐后、发起第二批委派之前，必须先单独完成一步直查：用 prometheus.metric_value 复查指标基线（metric 取 rpc_client_call_duration_seconds_count）——这一步是独立的直查步，不得与①合并、不得省略、不得由委派代替；④复查完成后，再以 delegate 分支委派 metrics 规则面专家（gap_id=g2）查告警规则与指标目录面——这是独立的第二批委派，必须单独发起；⑤g2 回执到齐后收敛：多源共同支撑时 kind=ROOT_CAUSE final 并引用证据 id；单源或零数据则 HYPOTHESIS，并把未尽缺口如实写进 missing_information。"

