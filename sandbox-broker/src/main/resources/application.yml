# Sandbox Broker 配置（M4 §4.2 独立进程）

spring:
  application:
    name: sandbox-broker

server:
  port: 8081  # Broker HTTP 端口（与 Control 8080 区分）

broker:
  # Docker 配置（目标配置：api 1.44，待 T00 在 195 实证）
  docker:
    host: unix:///var/run/docker.sock  # Docker socket 路径
    api-version: "1.44"                # Docker API 版本

  # Control API 配置（零 DB 直连，D1/D17/R1）
  control:
    base-url: http://localhost:8080    # Control App 基础 URL

  # Worker ID（Broker 实例标识）
  worker-id: broker-001

# Logging
logging:
  level:
    root: INFO
    com.objwww.pr.broker: DEBUG
    com.github.dockerjava: WARN
