# docker 部署占位（M0-T18 compose 起栈时启用：--spring.profiles.active=docker）
# datasource 指向 postgres 容器别名；密码只走环境变量，不落库不落文件。
spring:
  # 覆盖默认 profile 的排除项，恢复 DataSource 自动配置
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:pr_agent}
    username: publisher_app
    password: ${PUBLISHER_DB_PASSWORD}
  flyway:
    # 迁移唯一执行者是 control（表 owner）；publisher 只消费已建表，
    # publisher_app 角色无 schema CREATE 权，不关会启动即崩
    enabled: false

publisher:
  github:
    # GitHub App 凭证（T14 CredentialBroker）：私钥只读挂载（B16），不出进程不落日志
    app-id: ${GITHUB_APP_ID}
    installation-id: ${GITHUB_INSTALLATION_ID}
    private-key-path: ${GITHUB_APP_KEY_PATH:/run/secrets/github-app-key.pem}
    # 铸造 token 时收窄到的仓库名列表（逗号分隔；空 = installation 全域，M0 建议收窄）
    mint-repositories: ${GITHUB_MINT_REPOSITORIES:}
  # 只读 token 窄接口共享密钥：docker 栈必须注入真实值（无默认值 = 端点 fail-closed 401）
  internal-token-secret: ${INTERNAL_TOKEN_SECRET}
  # M1-T08 DriftReconciler（方案 §4.6）：资源漂移巡检节奏/预算/间隔/退避/阈值
  drift:
    # 每轮 API 预算（LIMIT 即预算，next_check_at 公平排序不饿死尾部，E2E-15）
    budget-per-round: ${DRIFT_BUDGET_PER_ROUND:50}
    # 正常巡检间隔（分钟）：探针命中后下一轮排期
    check-interval-minutes: ${DRIFT_CHECK_INTERVAL_MINUTES:60}
    # MISSING 低频复核倍率：interval × factor 后再查（§4.6）
    missing-recheck-factor: ${DRIFT_MISSING_RECHECK_FACTOR:8}
    # ReconcilerDegraded 告警阈值：连续探测失败次数（措辞修正 #3，EX-14）
    degraded-threshold: ${DRIFT_DEGRADED_THRESHOLD:3}
    # 新 CONFIRMED 资源首查宽限（秒）：insertResource 时 next_check_at = now()+宽限，
    # 消除"刚确认创建成功即被首轮巡检重探"的浪费，并错开测试基建探针登记延迟竞态（TB-25）
    first-check-grace-seconds: ${DRIFT_FIRST_CHECK_GRACE_SECONDS:10}
    idle-sleep-ms: ${DRIFT_IDLE_SLEEP_MS:60000}
    error-sleep-ms: ${DRIFT_ERROR_SLEEP_MS:60000}
