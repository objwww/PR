# 默认 profile：无数据库环境空跑启动。
# 已引入 spring-jdbc（Postgres 实现在 infrastructure，不加组件注解、
# 默认不装配），这里显式排除 DataSource/Flyway 自动配置；docker profile 用空列表覆盖恢复。
spring:
  application:
    name: control-app
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false
  ai:
    # M3：模型调用全走手工装配的双路由（M3ModelGatewayConfig），自动配置的单一
    # OpenAiChatModel 无人消费——显式关闭 chat 自动配置
    model:
      chat: none
    openai:
      # 仅占位：audio/image 等其余 OpenAI 自动配置（matchIfMissing）装配期要求非空 key，
      # 无真实凭证的 profile 也能启动；这些 bean 均无人消费。真实值只走环境变量注入
      api-key: ${AGENT_MODEL_API_KEY:placeholder-not-configured}
    retry:
      max-attempts: 1  # M3 INC-42/I34: 关闭 Spring AI 内置重试（官方默认 10 次），由 Gateway 管控；启动自检断言

# CAS（内容寻址存储）根目录：报告 artifact 落盘位置，不写死
app:
  artifact:
    cas-dir: ${APP_CAS_DIR:./var/cas}
  # AM1 告警 webhook 入口鉴权（键名与 compose/AlertSelfCheck 三方统一，BA-09①/G0-02）
  alert:
    webhook:
      bearer: ${ALERTMANAGER_WEBHOOK_BEARER_TOKEN:}
    # Holmes 常驻容器凭证桥接（BA-10①/G0-03）：Spring 不会自动把 HOLMES_API_KEY
    # 环境变量映射成 app.alert.holmes.api-key 属性，必须在 yml 显式占位。
    # compose 注入 HOLMES_BASE_URL / HOLMES_API_KEY；AlertFlowConfig 读 app.alert.holmes.*
    holmes:
      base-url: ${HOLMES_BASE_URL:http://holmes:8080}
      api-key: ${HOLMES_API_KEY:}
  # M3 模型治理配置（AM4 Java 替换 HolmesGPT 时复用；路由的模型/端点/密钥直接走环境变量
  # AGENT_MODEL / AGENT_MODEL_FALLBACK / OPENAI_COMPAT_BASE_URL(_FALLBACK) / AGENT_MODEL_API_KEY(_FALLBACK)）
  model:
    route:
      primary-id: ${APP_MODEL_ROUTE_PRIMARY_ID:primary}
      fallback-id: ${APP_MODEL_ROUTE_FALLBACK_ID:fallback}
    max-call-retries: 2            # 同路由 call 级重试上限（含首次共 3 次）
    budget:
      max-physical-calls-per-step: 6     # 主备共享
      max-prompt-tokens-per-call: 100000
      max-completion-tokens-per-call: 16000
      max-total-tokens-per-step: 120000
    gateway:
      total-deadline-ms: 300000          # Gateway 总时限（含一切退避等待）
      inline-retry-max-delay-ms: 15000   # 线程内等待上限，超出走 durable Defer
    per-call-timeout-ms: 120000          # 单次物理调用硬超时（同时派生 socket read-timeout）
    circuit:
      failure-threshold: 3
      cool-down-seconds: 60
    ledger:
      recovery-after-seconds: 240        # 启动校验：>= 2 × per-call-timeout
      recovery-scan-interval-ms: 60000
    retry:
      backoff-base-ms: 1000              # 无头 429 指数退避基数（带抖动）
      backoff-max-ms: 60000
    # 单价表：app.model.price.<model>.{input,output}-micros-per-1k + pricing-version + currency；
    # 双单价均为 0（默认）= 不估算；改价必须升 pricing-version
    price: {}
