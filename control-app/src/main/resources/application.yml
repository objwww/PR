# 默认 profile：无数据库环境空跑启动。
# 已引入 spring-jdbc（Postgres 实现在 infrastructure，不加组件注解、
# 默认不装配），这里显式排除 DataSource/Flyway 自动配置；docker profile 用空列表覆盖恢复。
spring:
  application:
    name: control-app
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false
  # EX-C3a：会话 8h 过期（LoginView 提示面承诺）；服务端会话由 Spring Security 管理
  servlet:
    session:
      timeout: 8h
  ai:
    # M3：模型调用全走手工装配的双路由（M3ModelGatewayConfig），自动配置的单一
    # OpenAiChatModel 无人消费——显式关闭 chat 自动配置
    model:
      chat: none
    openai:
      # 仅占位：audio/image 等其余 OpenAI 自动配置（matchIfMissing）装配期要求非空 key，
      # 无真实凭证的 profile 也能启动；这些 bean 均无人消费。真实值只走环境变量注入
      api-key: ${AGENT_MODEL_API_KEY:placeholder-not-configured}
    retry:
      max-attempts: 1  # M3 INC-42/I34: 关闭 Spring AI 内置重试（官方默认 10 次），由 Gateway 管控；启动自检断言

# CAS（内容寻址存储）根目录：报告 artifact 落盘位置，不写死
app:
  artifact:
    cas-dir: ${APP_CAS_DIR:./var/cas}
  # AM1 告警 webhook 入口鉴权（键名与 compose/AlertSelfCheck 三方统一，BA-09①/G0-02）
  alert:
    webhook:
      bearer: ${ALERTMANAGER_WEBHOOK_BEARER_TOKEN:}
    # M5-16 防自噬路由：控制面合成告警（RCA_SYSTEM 家族/monitoring_scope 声明）的
    # 独立身份与白名单——body 同名 label 单独不作数（方案 §3.2）；bearer 空 = 恒拒
    control-router:
      bearer: ${CONTROL_WEBHOOK_BEARER_TOKEN:}
      allowed-receivers: rca-oncall
      allowed-scopes: rca_system
    # M6-07 Holmes 退场：app.alert.fallback.*（V33 铸造面 bean 已拆）、
    # app.alert.shadow.holmes.*（V34 观察面 bean 已拆）、app.alert.holmes.*（凭证桥接，
    # 服务与 .env 键已回收）三键族随之摘除——不留死闸（决策记录 §9 步骤⑦裁定）。
    # 历史形态见 git tag pre-holmes-removal。
  # AM5 M5-09：ConfigBundle 发布/回滚 API 鉴权（release 角色共享凭证，O-4 用户体系
  # 落地前的形态；键名与 compose 三方统一沿 alert.webhook.bearer 惯例）
  release:
    api:
      bearer: ${APP_RELEASE_API_BEARER:}
  # AM5 M5-12：Operator Case API 鉴权（operator 角色共享凭证，O-4 用户体系落地前形态）
  operator:
    api:
      bearer: ${APP_OPERATOR_API_BEARER:}
  # EX-C3a：浏览器用户会话（Spring Security 6）。单人运维授权形态——运维在配置侧
  # 预置唯一 operator 账号（compose 以 :? 强制注入生产真值；此处默认仅本地 dev：
  # 账号 operator / 口令 operator）。口令只存 bcrypt 哈希（htpasswd -bnBC 10 生成），
  # 原文不落任何配置/日志。
  auth:
    operator:
      username: ${AUTH_OPERATOR_USERNAME:operator}
      password-bcrypt: ${AUTH_OPERATOR_PASSWORD_BCRYPT:$2a$10$XYv0PhQ60xu0aI8S/MlGSO//jvVykSfOAdXAXG6FwG4eHDFHoHwgO}
  # M3 模型治理配置（AM4 Java 替换 HolmesGPT 时复用；路由的模型/端点/密钥直接走环境变量
  # AGENT_MODEL / AGENT_MODEL_FALLBACK / OPENAI_COMPAT_BASE_URL(_FALLBACK) / AGENT_MODEL_API_KEY(_FALLBACK)）
  model:
    route:
      primary-id: ${APP_MODEL_ROUTE_PRIMARY_ID:primary}
      fallback-id: ${APP_MODEL_ROUTE_FALLBACK_ID:fallback}
    max-call-retries: 2            # 同路由 call 级重试上限（含首次共 3 次）
    budget:
      max-physical-calls-per-step: 6     # 主备共享
      max-prompt-tokens-per-call: 100000
      max-completion-tokens-per-call: 16000
      max-total-tokens-per-step: 120000
    gateway:
      total-deadline-ms: 300000          # Gateway 总时限（含一切退避等待）
      inline-retry-max-delay-ms: 15000   # 线程内等待上限，超出走 durable Defer
    per-call-timeout-ms: 120000          # 单次物理调用硬超时（同时派生 socket read-timeout）
    circuit:
      failure-threshold: 3
      cool-down-seconds: 60
    ledger:
      recovery-after-seconds: 240        # 启动校验：>= 2 × per-call-timeout
      recovery-scan-interval-ms: 60000
    retry:
      backoff-base-ms: 1000              # 无头 429 指数退避基数（带抖动）
      backoff-max-ms: 60000
    # 单价表：app.model.price.<model>.{input,output}-micros-per-1k + pricing-version + currency；
    # 双单价均为 0（默认）= 不估算；改价必须升 pricing-version
    price: {}

# M3-28：actuator 最小暴露面——health/metrics 仅运维面（宿主端口本就 127.0.0.1 绑定，
# INV-AM0-1）；env/heapdump 等敏感端点一律不开
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  # AM5 M5-15：应用侧 trace 采样第一道面（compose APP_TRACE_SAMPLING 注入）；风险
  # trace 保留的最终裁决在 collector 侧 tail_sampling（错误/慢全保，健康 10%）
  tracing:
    sampling:
      probability: ${APP_TRACE_SAMPLING:0.1}
