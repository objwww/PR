# docker 部署占位（compose 起栈时启用：--spring.profiles.active=docker）
# datasource 指向 postgres 容器别名；密码只走环境变量，不落库不落文件。
spring:
  # 覆盖默认 profile 的排除项，恢复 DataSource/Flyway 自动配置
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:pr_agent}
    username: control_app
    password: ${CONTROL_DB_PASSWORD}
    # BA-12④ Hikari 显式预算（§15 连接预算 12）：默认 10 池 + 30s 连接超时在告警洪峰下
    # 会拖垮 slot/task 领取短事务——快速失败给 5s，拿不到连接立即让出而不是排队挂死
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  flyway:
    # 迁移由 compose 独立 one-shot 服务 migrate（flyway/flyway，owner 身份）执行；
    # control 容器不持 DDL 凭证，compose 以 SPRING_FLYWAY_ENABLED=false 关闭此处自动迁移
    enabled: true

# docker 栈内 CAS 目录挂卷（独立于应用只读 rootfs 的可写卷）
app:
  artifact:
    cas-dir: ${APP_CAS_DIR:./var/cas}
  # M3 模型治理（AM4 复用）：旋钮默认值见 application.yml；这里只留部署期需按需覆盖的面。
  # 路由模型/端点/密钥直接走环境变量（AGENT_MODEL(_FALLBACK) / OPENAI_COMPAT_BASE_URL(_FALLBACK) /
  # AGENT_MODEL_API_KEY(_FALLBACK)），不落 yml。
  model:
    budget:
      max-prompt-tokens-per-call: ${APP_MODEL_MAX_PROMPT_TOKENS:100000}
      max-completion-tokens-per-call: ${APP_MODEL_MAX_COMPLETION_TOKENS:16000}
      max-total-tokens-per-step: ${APP_MODEL_MAX_TOTAL_TOKENS:120000}
