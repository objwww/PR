# docker 部署占位（M0-T18 compose 起栈时启用：--spring.profiles.active=docker）
# datasource 指向 postgres 容器别名；密码只走环境变量，不落库不落文件。
spring:
  # 覆盖默认 profile 的排除项，恢复 DataSource/Flyway 自动配置
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:pr_agent}
    username: control_app
    password: ${CONTROL_DB_PASSWORD}
  flyway:
    # T18：迁移由 compose 独立 one-shot 服务 migrate（flyway/flyway，owner 身份）执行；
    # control 容器不持 DDL 凭证，compose 以 SPRING_FLYWAY_ENABLED=false 关闭此处自动迁移
    enabled: true
  ai:
    openai:
      # OpenAI 兼容端点（百炼等），见 .env
      base-url: ${OPENAI_COMPAT_BASE_URL}
      api-key: ${AGENT_MODEL_API_KEY}
      chat:
        options:
          model: ${AGENT_MODEL:qwen-plus}

# docker 栈内 CAS 目录挂卷（B16：独立于应用只读 rootfs 的可写卷）
app:
  artifact:
    cas-dir: ${APP_CAS_DIR:./var/cas}
  github:
    # GitHub API base（stub 模式指向 compose 内网 github-stub；默认真实 api.github.com）
    api-base: ${GITHUB_API_BASE:https://api.github.com}
    # webhook 验签密钥：docker 栈必须注入真实值，缺失即启动失败（fail-closed）
    webhook-secret: ${GITHUB_WEBHOOK_SECRET}
    # 只读 token 窄接口（T14，评审修正 #6）：Publisher 内网别名 + 共享密钥头，两边一致才放行
    token-endpoint: ${PUBLISHER_TOKEN_ENDPOINT:http://publisher:8081}
    internal-token-secret: ${INTERNAL_TOKEN_SECRET}
