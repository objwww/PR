# 旧版本永不改写（已落档 review_verdict.rubric_version 的可解析性 = 审计闭环）。
rubrics:
  - id: rca-eval-review
    version: eval-review-rubric-v1
    current: true
    items:
      - id: root_cause_correct
        label: 根因组件与故障类型判定正确
        required: true
      - id: evidence_grounded
        label: 结论有证据引用支撑
        required: true
      - id: remediation_actionable
        label: 处置建议可执行
        required: false
