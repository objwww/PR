# EX-B2 IT 用最小 Loki 单二进制配置（Testcontainers；生产面配置另在 deploy/alert/loki/）
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  retention_period: 72h
ingester:
  wal:
    enabled: false
# 单二进制 all 目标会初始化 ruler-storage，缺 directory 即退出码 1（B-33）
ruler:
  storage:
    type: local
    local:
      directory: /tmp/rules
  rule_path: /tmp/scratchpad
