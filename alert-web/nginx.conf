# EX-C1：alert-web nginx 配置（入库面——盘点 P0-3「nginx 配置补入库」）。
# 律：control-app 路径自带 /api 前缀——proxy_pass 不带尾部斜杠、零重写
# （与 vite proxy 删 rewrite 同律：重写剥前缀 = 必然 404）。
# SSE：/api/rca-runs/{id}/events/stream 经同 location 透传——关缓冲、拉长读超时；
# 断线重连由客户端重新换票（票 30s 单次），nginx 侧无需长驻特殊配置。
server {
    # 8080 非特权端口（容器以 nginx 用户跑、零 capability——listen<1024 需要特权，避开）
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资产带不可变指纹（vite build 产物名含 hash）——可放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://control-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # SPA 路由回退（createWebHistory 深链直刷不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
